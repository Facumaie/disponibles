<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DISPONIBLES DPEM</title>
  <link id="app-favicon" rel="icon" type="image/png" href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="/>
  <link id="app-touch-icon" rel="apple-touch-icon" href="icon-192.png"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="theme-color" content="#1e3a8a"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Disponibles"/>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <!-- SheetJS para importar nómina -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#f0f4f8;--surface:#ffffff;--card:#f8fafc;
      --border:#dde2ea;--primary:#1d4ed8;--primary-h:#2563eb;
      --accent:#d97706;--accent-l:#92400e;
      --ok:#059669;--ok-l:#065f46;
      --bad:#dc2626;--bad-l:#991b1b;
      --text:#1e293b;--muted:#64748b;--dim:#94a3b8;
      --dgad:#0891b2;--dae:#059669;--dip:#d97706;--dayl:#7c3aed;
      --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
      --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.05);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:14px;min-height:100vh;-webkit-font-smoothing:antialiased}

    /* HEADER */
    .hdr{background:var(--surface);border-bottom:2px solid var(--primary);box-shadow:var(--shadow-md);padding:0 20px;height:54px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200}
    .hdr-title{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;color:var(--primary);letter-spacing:1px}
    .hdr-sub{font-size:10px;color:var(--muted);letter-spacing:.4px}
    .hdr-sp{flex:1}
    .hdr-week{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:6px;padding:5px 11px}
    .hdr-wl{font-size:11px;color:var(--muted)}
    .hdr-wv{font-family:'Oswald',sans-serif;font-size:13px;color:var(--primary)}
    .badge-role{color:#fff;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.4px}
    .btn-out{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px;transition:all .2s}
    .btn-out:hover{border-color:var(--bad);color:var(--bad-l)}

    /* LAYOUT */
    .main{max-width:1440px;margin:0 auto;padding:20px}

    /* TABS */
    .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px}
    .tab{padding:8px 16px;background:none;border:none;color:var(--muted);cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;transition:all .2s;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:5px}
    .tab:hover{color:var(--text)}
    .tab.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
    .tab-dot{width:7px;height:7px;border-radius:50%;background:var(--bad)}
    .tab-dot.ok{background:var(--ok)}

    /* CARDS */
    .card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
    .card-t{font-family:'Oswald',sans-serif;font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:7px}
    .sec-t{font-family:'Oswald',sans-serif;font-size:18px;font-weight:600;color:var(--primary);margin-bottom:16px;display:flex;align-items:center;gap:10px}
    .sec-t::after{content:'';flex:1;height:1px;background:var(--border)}

    /* FORM */
    .frow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
    .fg{display:flex;flex-direction:column;gap:4px}
    .fg label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:500}
    input[type=text],input[type=password],select,textarea{background:#fff;border:1.5px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-family:'IBM Plex Sans',sans-serif;font-size:13px;transition:border-color .2s,box-shadow .2s;outline:none}
    input:focus,select:focus,textarea:focus{border-color:var(--primary-h);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
    select option{background:#fff}

    /* BUTTONS */
    .btn{padding:7px 13px;border-radius:4px;border:none;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;font-size:13px;font-weight:500;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-p{background:var(--primary);color:#fff}.btn-p:hover:not(:disabled){background:var(--primary-h)}
    .btn-ok{background:var(--ok);color:#fff}.btn-ok:hover:not(:disabled){background:#047857}
    .btn-bad{background:var(--bad);color:#fff}.btn-bad:hover:not(:disabled){background:#b91c1c}
    .btn-g{background:none;border:1px solid var(--border);color:var(--muted)}.btn-g:hover:not(:disabled){border-color:var(--text);color:var(--text)}
    .btn-a{background:var(--accent);color:#fff}.btn-a:hover:not(:disabled){background:#b45309}
    .btn-sm{padding:3px 8px;font-size:11px}
    .btn-lg{padding:11px 22px;font-size:15px}

    /* STATUS BADGES */
    .sb{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
    .sb-p{background:rgba(217,119,6,.15);color:var(--accent-l);border:1px solid rgba(217,119,6,.3)}
    .sb-ok{background:rgba(5,150,105,.15);color:var(--ok-l);border:1px solid rgba(5,150,105,.3)}

    /* DIVISION CARDS */
    .div-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:18px}
    .div-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px;border-left:4px solid var(--border);box-shadow:var(--shadow)}
    .div-card.ok{border-left-color:var(--ok)}
    .div-card.pend{border-left-color:var(--accent)}
    .dc-abbr{font-family:'Oswald',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;margin-bottom:3px}
    .dc-name{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.4}
    .dc-meta{font-size:11px;color:var(--dim);font-family:'IBM Plex Mono',monospace;margin-top:5px}

    /* AVAILABILITY GRID */
    .grid-wrap{overflow-x:auto}
    .avt{width:100%;border-collapse:collapse;font-size:12px}
    .avt th{background:var(--primary);padding:6px 7px;text-align:left;font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#fff;border:1px solid rgba(255,255,255,.15);white-space:nowrap}
    .avt th.dc{text-align:center;min-width:130px;vertical-align:top}
    .avt td{border:1px solid var(--border);padding:3px 5px;vertical-align:middle}
    .avt tr:nth-child(even) td{background:#f8faff}
    .avt tr:hover td{background:#eef2ff}
    .evt-row td{background:rgba(29,78,216,.07)!important;font-size:10px;color:var(--muted);padding:3px 7px;font-family:'IBM Plex Mono',monospace;text-align:center;border:1px solid var(--border)}
    .div-hdr-row td{background:#eef2ff!important;font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;letter-spacing:.7px;color:var(--primary);text-transform:uppercase;padding:6px 9px;border:1px solid var(--border)}
    .avail-inp{width:100%;background:transparent;border:1px solid transparent;color:var(--text);padding:4px 4px;font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;border-radius:4px;outline:none;text-align:center;min-width:115px}
    .avail-inp:focus{background:#eef2ff;border-color:var(--primary)}
    /* STICKY COLUMNS — nombres fijos al scrollear horizontalmente */
    .avt th.sticky-col, .avt td.sticky-col{position:sticky;z-index:2}
    .avt th.sticky-col{background:var(--primary);z-index:3}
    .avt td.sticky-col{background:#ffffff}
    .avt tr:nth-child(even) td.sticky-col{background:#f8faff}
    .avt tr:hover td.sticky-col{background:#eef2ff}
    .avt th.sticky-col-1,.avt td.sticky-col-1{left:0}
    .avt th.sticky-col-2,.avt td.sticky-col-2{left:115px}
    .avt th.sticky-col-3,.avt td.sticky-col-3{left:230px}
    .avt td.sticky-col-3{border-right:2px solid var(--primary) !important}

    /* PERSONNEL TABLE */
    .ptbl{width:100%;border-collapse:collapse}
    .ptbl th{background:#f1f5f9;padding:7px 10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);border-bottom:2px solid var(--border)}
    .ptbl td{padding:7px 10px;border-bottom:1px solid var(--border);font-size:13px}
    .ptbl tr:last-child td{border-bottom:none}
    .ptbl tr:hover td{background:rgba(255,255,255,.02)}

    /* LOGIN */
    .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#0b1220;background-image:radial-gradient(ellipse at 50% -10%,rgba(37,99,235,.28) 0%,transparent 55%),radial-gradient(ellipse at 15% 90%,rgba(37,99,235,.14) 0%,transparent 50%),radial-gradient(ellipse at 85% 20%,rgba(251,191,36,.06) 0%,transparent 45%)}
    .login-box{width:100%;max-width:500px}
    .login-card{background:rgba(255,255,255,.98);border:1px solid rgba(255,255,255,.6);border-radius:16px;padding:34px 30px 28px;box-shadow:0 24px 60px rgba(0,0,0,.45),0 2px 0 rgba(251,191,36,.5) inset;backdrop-filter:blur(4px)}
    .login-logo{text-align:center;margin-bottom:24px}
    .login-crest{width:118px;height:auto;margin:0 auto 16px;display:block;filter:drop-shadow(0 8px 18px rgba(0,0,0,.28))}
    .login-t{font-family:'Oswald',sans-serif;font-size:29px;font-weight:700;color:var(--primary);letter-spacing:2.5px;margin-bottom:5px;line-height:1}
    .login-s{font-size:10.5px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
    .login-rule{width:56px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent),#fbbf24);margin:14px auto 0}
    .login-foot{text-align:center;font-size:10px;color:var(--dim);letter-spacing:.5px;margin-top:18px}
    .divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px}
    .divider-l{flex:1;height:1px;background:var(--border)}
    .divider-t{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
    .div-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
    .div-btn{background:#fff;border:1.5px solid var(--border);color:var(--text);padding:13px;border-radius:8px;cursor:pointer;text-align:left;transition:all .2s;font-family:'IBM Plex Sans',sans-serif;box-shadow:var(--shadow)}
    .div-btn:hover,.div-btn.sel{border-color:var(--primary);background:rgba(29,78,216,.06);box-shadow:0 0 0 3px rgba(29,78,216,.1)}
    .div-abbr{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;margin-bottom:3px}
    .div-name{font-size:11px;color:var(--muted);line-height:1.35}
    .adm-btn{width:100%;background:#fff;border:1.5px solid var(--border);color:var(--muted);padding:11px;border-radius:8px;cursor:pointer;text-align:center;transition:all .2s;font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:1px;margin-bottom:10px;box-shadow:var(--shadow)}
    .adm-btn:hover,.adm-btn.sel{border-color:var(--primary);color:var(--primary);background:rgba(29,78,216,.04)}
    .pw-box{background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:16px;box-shadow:var(--shadow)}
    .pw-lbl{font-size:12px;color:var(--muted);margin-bottom:7px}
    .pw-err{color:var(--bad-l);font-size:12px;margin-top:7px}

    /* TOAST */
    .toast-wrap{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:7px}
    .toast{background:#fff;border:1px solid var(--border);border-radius:8px;padding:11px 13px;min-width:270px;max-width:340px;display:flex;align-items:flex-start;gap:9px;animation:tIn .3s ease;box-shadow:0 8px 25px rgba(0,0,0,.12)}
    .toast.ok{border-left:4px solid var(--ok)}.toast.bad{border-left:4px solid var(--bad)}.toast.info{border-left:4px solid var(--primary)}
    .toast-ico{font-size:14px}.toast-c{flex:1}
    .toast-t{font-weight:600;font-size:13px;margin-bottom:2px}.toast-m{font-size:11px;color:var(--muted)}
    .toast-x{background:none;border:none;color:var(--dim);cursor:pointer;font-size:12px;padding:0}
    @keyframes tIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

    /* WEEK CONFIG */
    .days-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .day-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;box-shadow:var(--shadow)}
    .day-card-t{font-family:'Oswald',sans-serif;font-size:12px;font-weight:700;color:var(--accent-l);margin-bottom:7px;letter-spacing:.4px}

    /* EVENTOS PER DAY (division view) */
    .evt-panel{background:#eef2ff;border:1px solid rgba(29,78,216,.2);border-radius:8px;padding:12px;margin-bottom:14px}
    .evt-panel-t{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin-bottom:8px;font-weight:600}
    .evt-days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
    .evt-day-col{min-width:140px;max-width:160px;flex-shrink:0}
    .evt-day-hdr{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;color:var(--accent-l);margin-bottom:5px;letter-spacing:.3px}
    .evt-item{font-size:10px;padding:2px 0;line-height:1.3;font-family:'IBM Plex Mono',monospace}
    .evt-item.fixture{color:var(--muted)}
    .evt-item.custom{color:#60a5fa;display:flex;align-items:center;gap:4px}
    .evt-add-row{display:flex;gap:4px;margin-top:4px}
    .evt-add-inp{flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text);padding:3px 6px;border-radius:3px;font-size:10px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;outline:none;min-width:0}
    .evt-add-inp:focus{border-color:var(--primary)}
    .evt-add-btn{background:rgba(29,78,216,.3);border:1px solid rgba(29,78,216,.5);color:#93c5fd;padding:2px 7px;border-radius:3px;cursor:pointer;font-size:11px;font-weight:600;white-space:nowrap}
    .evt-add-btn:hover{background:rgba(29,78,216,.5)}

    /* IMPORT MODAL */
    .modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
    .modal-box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:24px;max-width:520px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-md)}
    .modal-t{font-family:'Oswald',sans-serif;font-size:18px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
    .modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:0}
    .import-preview{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:12px;max-height:220px;overflow-y:auto;margin-bottom:14px}
    .import-row{display:flex;gap:10px;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px}
    .import-row:last-child{border-bottom:none}
    .import-col1{width:130px;color:var(--muted);font-size:11px}
    .import-col2{width:120px;font-weight:600}
    .import-col3{flex:1}
    .import-drop{border:2px dashed var(--border);border-radius:8px;padding:28px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:12px;background:#fafbff}
    .import-drop:hover{border-color:var(--primary);background:rgba(29,78,216,.05)}
    .import-drop.drag{border-color:var(--ok);background:rgba(5,150,105,.08)}

    /* MISC */
    .alert-warn{background:rgba(217,119,6,.1);border:1px solid rgba(217,119,6,.3);border-radius:8px;padding:14px 16px;color:var(--accent-l)}
    .alert-ok{background:rgba(5,150,105,.1);border:1px solid rgba(5,150,105,.3);border-radius:8px;padding:14px 16px;color:var(--ok-l)}
    .stat-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
    .tile{background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px;box-shadow:var(--shadow)}
    .tile-l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
    .tile-v{font-family:'Oswald',sans-serif;font-size:20px;color:var(--primary)}
    ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#f0f4f8}::-webkit-scrollbar-thumb{background:#c8d0de;border-radius:6px}::-webkit-scrollbar-thumb:hover{background:#a0aec0}
    @media(max-width:768px){.days-grid,.div-grid{grid-template-columns:1fr}.main{padding:12px}.stat-tiles{grid-template-columns:1fr 1fr}}
    .tabs{overflow-x:auto}
    .tab{white-space:nowrap;flex-shrink:0}
    .avt td.fc{position:relative}
    .fill-h{position:absolute;right:0;bottom:0;width:9px;height:9px;background:var(--primary);border:1px solid #fff;cursor:crosshair;display:none;z-index:3}
    .avt td.fc:hover .fill-h,.avt td.fc:focus-within .fill-h{display:block}
    .filling,.filling *{user-select:none;cursor:crosshair}
    @media (max-width:768px){.fill-h{display:none !important}}
  </style>
</head>

</datalist>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ══════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════
const FIREBASE_CONFIG = {

// ══════════════════════════════════════════════════════════

const rosterSig = arr => (arr||[]).map(p=>`${p.jerarquia||''}|${p.apellido||''}|${p.nombre||''}`).sort().join('¬');

const fmtDT = ts => {
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
};
const sortP = arr => [...arr].sort((a,b)=>{
  const oa = J_ORD[(a.jerarquia||'').toLowerCase()] ?? 99;
  const ob = J_ORD[(b.jerarquia||'').toLowerCase()] ?? 99;
  return oa!==ob ? oa-ob : a.apellido.localeCompare(b.apellido);
});
const avColor = v => {
  if(!v) return 'var(--dim)';
  const u = v.toUpperCase();
  if(u==='DISPONIBLE') return '#4ade80';
  if(u==='VOLUNTARIO') return '#14b8a6';
  if(u.includes('- NO')||u==='NO') return '#f87171';
  if(u.includes('GUARDIA')&&!u.includes('EDILICIA')) return '#fb923c';
  if(u.includes('PERMANENCIA')) return '#a78bfa';
  if(u.includes('A/C')||u.includes('UCO')||u.includes('ARMERO')||u.includes('ARMERA')||u.includes('MOTO')) return '#60a5fa';
  if(u.includes('ESPECÍFICA')) return '#c084fc';
  return 'var(--text)';
};

// Estilo condicional de celda de asignación en el Excel (replica formato institucional del ejemplo)
// alt = fila par/impar para el zebra de fondo neutro
function estiloAsignacion(cell, alt){
  const v = (cell.value||'').toString().trim().toUpperCase();
  const base = alt ? 'FFF8FAFC' : 'FFFFFFFF';
  cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb:base}};
  cell.font = {size:10,name:'Calibri',color:{argb:'FF1E293B'}};
  cell.alignment = {horizontal:'center',vertical:'middle',wrapText:true};
  cell.border = {bottom:{style:'hair',color:{argb:'FFE2E8F0'}}};
  if(!v) return;
  const NO     = /(-\s*NO\b)|(^NO$)|(\bNO\s*-)|(NO QUEDA OTRA)/;      // no disponible → rojo
  const ASIGN  = /^(A\/C|ARMER[OA]|MOTO|SECUNDANTE)\b/;                // afectado a puesto → azul (ARMERO/ARMERA)
  if(NO.test(v)){
    cell.fill.fgColor = {argb:'FFDC2626'};
    cell.font = {size:10,name:'Calibri',bold:true,color:{argb:'FFFFFFFF'}};
  } else if(v==='DISPONIBLE SECTOR' || ASIGN.test(v)){
    cell.fill.fgColor = {argb:'FF1D4ED8'};
    cell.font = {size:10,name:'Calibri',bold:true,color:{argb:'FFFFFFFF'}};
  } else if(v==='DISPONIBLE'){
    cell.font.color = {argb:'FF059669'};
  } else if(v==='VOLUNTARIO'){
    cell.fill.fgColor = {argb:'FFCCFBF1'};
    cell.font = {size:10,name:'Calibri',bold:true,color:{argb:'FF0F766E'}};
  } else if(/^UCO\b/.test(v)){
    cell.font.color = {argb:'FF1D4ED8'};
  }
}

// ══════════════════════════════════════════════════════════
//  EXCEL IMPORT UTILS (SheetJS)
// ══════════════════════════════════════════════════════════
const parseNominaExcel = (arrayBuffer) => {
  const wb = XLSX.read(new Uint8Array(arrayBuffer), {type:'array'});
  const results = [];
  const jerSet = new Set(JERARQUIAS.map(j=>j.toLowerCase()));
  
  for(const sheetName of wb.SheetNames){
    const ws = wb.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
    for(const row of rows){
      const col0 = String(row[0]||'').trim();
      const col1 = String(row[1]||'').trim();
      const col2 = String(row[2]||'').trim();
      if(!col0||!col1) continue;
      const jer = JERARQUIAS.find(j=>j.toLowerCase()===col0.toLowerCase());
      if(jer && col1){
        results.push({ id:uid(), jerarquia:jer, apellido:col1.toUpperCase(), nombre:col2.toUpperCase() });
      }
    }
  }
  // Remove duplicates by apellido+nombre
  const seen = new Set();
  return results.filter(p=>{
    const k = `${p.jerarquia}|${p.apellido}|${p.nombre}`;
    if(seen.has(k)) return false;
    seen.add(k); return true;
  });
};

//  WEEK MANAGER (Admin) — Fixture de eventos
// ══════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════
//  PARSER DE FIXTURE: reconoce líneas de fecha al pegar
//  Ej: "Jueves 24", "JUEVES 24/04", "24/04/2026", "Jueves 24 de abril"
// ══════════════════════════════════════════════════════════
const _DIAS='lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo';
const _MESES='enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre';
const _DATE_LINE=new RegExp('^\\s*(?:(?:'+_DIAS+')\\b[\\s,.\\-]*)?\\d{1,2}(?:\\s*(?:/|-|de)\\s*(?:\\d{1,2}|'+_MESES+'))?(?:\\s*(?:/|-|de)\\s*\\d{2,4})?\\s*:?\\s*$','i');
const _HAS_KEY=new RegExp('(?:'+_DIAS+')|(?:'+_MESES+')|\\d\\s*[/-]\\s*\\d','i');
const isDateLine = l => _DATE_LINE.test(l) && _HAS_KEY.test(l);
const normFecha = l => { const t=l.trim().replace(/\s*:\s*$/,'').replace(/\s+/g,' '); return t.charAt(0).toUpperCase()+t.slice(1).toLowerCase(); };
// devuelve [{label,eventos[]}]; el primer grupo puede tener label '' (líneas sueltas antes de la primera fecha)
const parseFixture = text => {
  const lines=String(text||'').split(/\r?\n/).map(l=>l.trim());
  const groups=[]; let cur={label:'',eventos:[]};
  lines.forEach(l=>{
    if(!l) return;
    if(isDateLine(l)){ if(cur.label||cur.eventos.length) groups.push(cur); cur={label:normFecha(l),eventos:[]}; }
    else cur.eventos.push(l);
  });
  if(cur.label||cur.eventos.length) groups.push(cur);
  return groups;
};

// Arma "24 al 29 de Abril" a partir de la primera y la última fecha cargadas
const _MES_NOM=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const _parseFechaDia = l => {
  const m=String(l||'').match(new RegExp('(\\d{1,2})(?:\\s*(?:/|-|de)\\s*(\\d{1,2}|'+_MESES+'))?','i'));
  if(!m) return null;
  let mes=null;
  if(m[2]){ mes=/^\d+$/.test(m[2]) ? parseInt(m[2],10)-1 : _MES_NOM.findIndex(x=>x.toLowerCase()===m[2].toLowerCase().replace('setiembre','septiembre')); if(mes<0||mes>11) mes=null; }
  return {d:parseInt(m[1],10),mes};
};
const periodoAuto = days => {
  const p=days.map(d=>_parseFechaDia(d.label)).filter(Boolean);
  if(!p.length) return '';
  const f=p[0], l=p[p.length-1];
  const mesF=f.mes ?? l.mes, mesL=l.mes ?? f.mes;
  const nm=i=>i==null?'':' de '+_MES_NOM[i];
  if(p.length===1) return `${f.d}${nm(mesF)}`;
  if(mesF===mesL) return `${f.d} al ${l.d}${nm(mesL)}`;
  return `${f.d}${nm(mesF)} al ${l.d}${nm(mesL)}`;
};

const WeekMgr = () => {
  const [weeks,setWeeks]   = useState([]);
  const [show,setShow]     = useState(false);
  const [editId,setEditId] = useState(null); // null = crear, id = editar
  const [viewId,setViewId] = useState(null); // semana abierta en modo solo lectura
  const [bulk,setBulk]     = useState('');
  const [labManual,setLabManual] = useState(false); // true si el nombre del período se escribió a mano
  const [lab,setLab]       = useState('');
  const emptyDay = () => ({label:'',serial:'',eventos:''});
  const [days,setDays]     = useState(Array(6).fill(null).map(emptyDay));
  const [saving,setSaving] = useState(false);

  useEffect(()=>db.collection('semanas').orderBy('creadaEn','desc').onSnapshot(s=>setWeeks(s.docs.map(d=>({id:d.id,...d.data()})))),[]);

  const updDay   = (i,f,v) => setDays(d=>{ const n=[...d]; n[i]={...n[i],[f]:v}; return n; });
  const addDay   = () => setDays(d=>[...d, emptyDay()]);
  const removeDay = (i) => { if(days.length<=1) return; setDays(d=>d.filter((_,idx)=>idx!==i)); };

  // Aplica grupos detectados a partir del día `start`
  const applyGroups = (groups,start) => setDays(d=>{
    const n=[...d]; let idx=start;
    groups.forEach((g,gi)=>{
      if(!g.label){ // líneas sueltas antes de la primera fecha → quedan en el día actual
        n[start]={...n[start],eventos:[n[start].eventos,...g.eventos].filter(Boolean).join('\n')};
        if(gi===0) idx=start+1; return;
      }
      while(idx>=n.length) n.push(emptyDay());
      n[idx]={...n[idx],label:g.label,eventos:g.eventos.join('\n')}; idx++;
    });
    return n;
  });
  // Pegado en FECHA o en FIXTURE: si hay fechas en el texto, las reconoce solo
  const onPasteDay = (e,i) => {
    const t=e.clipboardData.getData('text'); if(!t) return;
    const g=parseFixture(t);
    if(!g.some(x=>x.label)) return;           // sin fechas: pegado normal
    e.preventDefault(); applyGroups(g,i);
    const nd=g.filter(x=>x.label).length;
    toast('ok',`${nd} fecha${nd>1?'s':''} reconocida${nd>1?'s':''}`,g.filter(x=>x.label).map(x=>x.label).join(' · '));
  };
  const detectBulk = () => {
    const g=parseFixture(bulk).filter(x=>x.label);
    if(!g.length){ toast('bad','Sin fechas','No se detectó ninguna línea de fecha (ej: "Jueves 24" o "24/04").'); return; }
    setDays(g.map(x=>({label:x.label,serial:'',eventos:x.eventos.join('\n')})));
    setBulk(''); toast('ok',`${g.length} días cargados`,g.map(x=>x.label).join(' · '));
  };

  useEffect(()=>{ if(!labManual) setLab(periodoAuto(days)); },[days,labManual]);

  const resetForm = () => { setShow(false); setEditId(null); setLab(''); setLabManual(false); setDays(Array(6).fill(null).map(emptyDay)); };

  // Abrir formulario en modo EDICIÓN, precargando los datos de la semana
  const startEdit = (w) => {
    setEditId(w.id);
    setLab(w.label||''); setLabManual(true);
    // Cargar los días que tenga la semana (mínimo 6 para no perder slots)
    const existingDays = (w.dias||[]).map(d=>({ label:d.label||'', serial:d.serial||'', eventos:(d.eventos||[]).join('\n') }));
    const filled = existingDays.length >= 6 ? existingDays : [...existingDays, ...Array(6-existingDays.length).fill(null).map(emptyDay)];
    setDays(filled);
    setShow(true);
    window.scrollTo({top:0,behavior:'smooth'});
  };

  const create = async () => {
    if(!lab.trim()){toast('bad','Error','Ingresá el nombre del período');return;}
    setSaving(true);
    try{
      // Auto-cargar nóminas: Firestore guardadas → DEFAULT_NOMINAS como fallback
      const nominaSnaps = await Promise.all(DIVISIONS.map(d=>db.collection('nominas').doc(d.id).get()));
      const autoPersonal = {};
      DIVISIONS.forEach((div,i)=>{
        const snap = nominaSnaps[i];
        if(snap.exists && snap.data().personal?.length){
          autoPersonal[div.id] = snap.data().personal;
        } else {
          autoPersonal[div.id] = mkDefaultPersonal(div.id);
        }
      });
      const ref = await db.collection('semanas').add({
        label:lab.trim(),
        dias:days.map(d=>({label:d.label,serial:d.serial,eventos:d.eventos.split('\n').map(e=>e.trim()).filter(Boolean)})),
        activa:false,
        creadaEn:firebase.firestore.FieldValue.serverTimestamp()
      });
      for(const div of DIVISIONS)
        await db.collection('semanas').doc(ref.id).collection('divisiones').doc(div.id)
          .set({estado:'pendiente',enviadaEn:null,personal:autoPersonal[div.id]||[],eventosExtra:{}});
      audNow({weekId:ref.id,weekLabel:lab.trim(),div:'',by:'DSED'},{k:'sem',x:`Creó la semana «${lab.trim()}»`});
      const cargadas = DIVISIONS.filter(d=>autoPersonal[d.id]?.length).length;
      toast('ok','Semana creada', cargadas ? `${lab.trim()} — Nómina pre-cargada (${cargadas} divisiones)` : lab.trim());
      resetForm();
    }catch(e){toast('bad','Error',e.message);}
    setSaving(false);
  };

  const update = async () => {
    if(!lab.trim()){toast('bad','Error','Ingresá el nombre del período');return;}
    setSaving(true);
    try{
      await db.collection('semanas').doc(editId).update({
        label: lab.trim(),
        dias:  days.map(d=>({label:d.label,serial:d.serial,eventos:d.eventos.split('\n').map(e=>e.trim()).filter(Boolean)})),
      });
      audNow({weekId:editId,weekLabel:lab.trim(),div:'',by:'DSED'},{k:'sem',x:`Editó la semana «${lab.trim()}» (fechas / fixture)`});
      toast('ok','Semana actualizada',lab);
      resetForm();
    }catch(e){toast('bad','Error al guardar',e.message);}
    setSaving(false);
  };

  const activate = async (id) => {
    for(const w of weeks) if(w.activa) await db.collection('semanas').doc(w.id).update({activa:false});
    await db.collection('semanas').doc(id).update({activa:true});
    // Auto-restaurar nóminas en divisiones vacías (Firestore → DEFAULT_NOMINAS)
    try{
      const [nomSnaps, divSnaps] = await Promise.all([
        Promise.all(DIVISIONS.map(d=>db.collection('nominas').doc(d.id).get())),
        Promise.all(DIVISIONS.map(d=>db.collection('semanas').doc(id).collection('divisiones').doc(d.id).get()))
      ]);
      const toRestore = [];
      DIVISIONS.forEach((div,i)=>{
        const tienePers = divSnaps[i].exists && divSnaps[i].data()?.personal?.length;
        if(tienePers) return; // ya tiene nómina cargada
        if(nomSnaps[i].exists && nomSnaps[i].data().personal?.length){
          toRestore.push({div, personal: nomSnaps[i].data().personal});
        } else {
          const def = mkDefaultPersonal(div.id);
          if(def.length) toRestore.push({div, personal: def});
        }
      });
      if(toRestore.length){
        await Promise.all(toRestore.map(({div,personal})=>
          db.collection('semanas').doc(id).collection('divisiones').doc(div.id)
            .set({personal},{merge:true})
        ));
      }
    }catch(e){ /* falla silenciosa; se puede restaurar manualmente desde Nómina */ }
    audNow({weekId:id,weekLabel:weeks.find(w=>w.id===id)?.label||'',div:'',by:'DSED'},{k:'sem',x:`Activó la semana «${weeks.find(w=>w.id===id)?.label||''}»`});
    toast('ok','Semana activada',weeks.find(w=>w.id===id)?.label);
  };

  const del = async (id,label) => {
    if(!confirm(`¿Eliminar "${label}"? Se borran todos los datos cargados.`)) return;
    if(editId===id) resetForm();
    await db.collection('semanas').doc(id).delete();
    audNow({weekId:id,weekLabel:label,div:'',by:'DSED'},{k:'sem',x:`Eliminó la semana «${label}»`});
    toast('info','Semana eliminada','');
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}}>
        <div className="sec-t" style={{flex:1,marginBottom:0}}>📅 Fixture de Eventos / Semanas</div>
        <button className="btn btn-p" onClick={()=>{ if(show&&!editId){resetForm();}else{resetForm();setShow(true);} }} style={{marginLeft:'12px'}}>
          {show?'✕ Cancelar':'+ Nueva Semana'}
        </button>
      </div>
      <div style={{fontSize:'12px',color:'var(--muted)',background:'rgba(29,78,216,.06)',border:'1px solid rgba(29,78,216,.2)',borderRadius:'6px',padding:'8px 12px',marginBottom:'16px'}}>
        ℹ Los eventos que cargues aquí serán el <strong>fixture visible para todas las divisiones</strong>. Cada división podrá agregar sus propios eventos adicionales.
      </div>

      {show&&(
        <div className="card" style={{marginBottom:'22px',borderLeft:editId?'4px solid var(--accent)':'4px solid var(--primary)'}}>
          <div className="card-t">
            {editId ? '✏ Editar Semana' : '⚙ Configurar Nueva Semana'}
          </div>
          <div className="fg" style={{marginBottom:'14px'}}>
            <label>Nombre del período</label>
            <input type="text" value={lab} onChange={e=>{setLab(e.target.value);setLabManual(true);}} style={{maxWidth:'360px'}}/>
            {!labManual&&lab&&<span style={{fontSize:'11px',color:'var(--ok-l)',marginTop:'3px'}}>✓ Armado automáticamente con las fechas. Podés editarlo.</span>}
            {labManual&&periodoAuto(days)&&periodoAuto(days)!==lab&&<button className="btn btn-g btn-sm" style={{marginTop:'4px',alignSelf:'flex-start'}} onClick={()=>{setLab(periodoAuto(days));setLabManual(false);}}>↻ Usar «{periodoAuto(days)}»</button>}
          </div>
          <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'8px'}}>Configurar cada día (dejá vacíos los días sin evento):</div>
          <div style={{background:'#eef2ff',border:'1px dashed rgba(29,78,216,.35)',borderRadius:'8px',padding:'10px 12px',marginBottom:'12px'}}>
            <div style={{fontSize:'11px',textTransform:'uppercase',letterSpacing:'.6px',color:'var(--muted)',fontWeight:600,marginBottom:'6px'}}>Pegar varios días de una vez</div>
            <textarea value={bulk} onChange={e=>setBulk(e.target.value)} rows={3} style={{width:'100%',resize:'vertical'}}/>
            <div style={{display:'flex',gap:'8px',alignItems:'center',marginTop:'6px',flexWrap:'wrap'}}>
              <button className="btn btn-p btn-sm" onClick={detectBulk} disabled={!bulk.trim()}>🗓 Detectar días y cargar</button>
              <span style={{fontSize:'11px',color:'var(--muted)'}}>Cada línea con una fecha abre un día nuevo; las líneas siguientes son sus eventos. También podés pegar directo en cualquier día.</span>
            </div>
          </div>
          <div className="days-grid">
            {days.map((d,i)=>(
              <div key={i} className="day-card">
                <div className="day-card-t" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span>DÍA {i+1}</span>
                  {days.length>1&&<button onClick={()=>removeDay(i)} title="Quitar este día" style={{background:'none',border:'none',cursor:'pointer',color:'var(--dim)',fontSize:'13px',padding:'0',lineHeight:1}} onMouseOver={e=>e.target.style.color='var(--bad)'} onMouseOut={e=>e.target.style.color='var(--dim)'}>✕</button>}
                </div>
                <div className="fg" style={{marginBottom:'6px'}}><label>Fecha</label><input type="text" value={d.label} onChange={e=>updDay(i,'label',e.target.value)} onPaste={e=>onPasteDay(e,i)}/></div>
                <div className="fg"><label>Fixture de eventos (uno por línea)</label><textarea value={d.eventos} onChange={e=>updDay(i,'eventos',e.target.value)} rows={3} onPaste={e=>onPasteDay(e,i)} style={{width:'100%',resize:'vertical'}}/></div>
              </div>
            ))}
          </div>
          <div style={{marginTop:'10px'}}>
            <button className="btn btn-g btn-sm" onClick={addDay}>＋ Agregar día</button>
            <span style={{fontSize:'11px',color:'var(--dim)',marginLeft:'10px'}}>{days.length} día{days.length!==1?'s':''} configurados</span>
          </div>
          <div style={{marginTop:'14px',display:'flex',gap:'10px',alignItems:'center'}}>
            {editId
              ? <button className="btn btn-ok btn-lg" onClick={update} disabled={saving}>{saving?'⏳ Guardando...':'💾 Guardar Cambios'}</button>
              : <button className="btn btn-ok btn-lg" onClick={create} disabled={saving}>{saving?'⏳ Guardando...':'✓ Crear Semana'}</button>
            }
            <button className="btn btn-ghost btn-sm" onClick={resetForm}>Cancelar</button>
          </div>
        </div>
      )}

      {weeks.length===0&&!show&&<div className="alert-warn">No hay semanas configuradas. Creá la primera para comenzar.</div>}
      {weeks.map(w=>(
        <div key={w.id} className="card" style={{borderLeft:w.activa?'4px solid var(--ok)':editId===w.id?'4px solid var(--accent)':'4px solid var(--border)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'8px'}}>
            <div>
              <div style={{display:'flex',alignItems:'center',gap:'9px'}}>
                <span style={{fontFamily:'Oswald',fontSize:'15px',fontWeight:700}}>{w.label}</span>
                {w.activa&&<span className="sb sb-ok">● ACTIVA</span>}
                {editId===w.id&&<span className="sb" style={{background:'rgba(217,119,6,.15)',color:'var(--accent-l)',border:'1px solid rgba(217,119,6,.3)'}}>✏ editando</span>}
              </div>
              <div style={{fontSize:'11px',color:'var(--muted)',marginTop:'3px',fontFamily:'IBM Plex Mono'}}>
                {(w.dias||[]).filter(d=>d.label).map(d=>d.label).join(' · ')}
              </div>
            </div>
            <div style={{display:'flex',gap:'7px'}}>
              <button className={`btn btn-sm ${viewId===w.id?'btn-p':'btn-g'}`} onClick={()=>setViewId(v=>v===w.id?null:w.id)}>{viewId===w.id?'▲ Cerrar':'👁 Ver'}</button>
              {!w.activa&&<button className="btn btn-p btn-sm" onClick={()=>activate(w.id)}>Activar</button>}
              <button className="btn btn-ghost btn-sm" onClick={()=>startEdit(w)}>✏ Editar</button>
              <button className="btn btn-bad btn-sm" onClick={()=>del(w.id,w.label)}>🗑 Eliminar</button>
            </div>
          </div>
          {viewId===w.id&&<WeekViewer week={w}/>}
        </div>
      ))}
    </div>
  );
};

// ══════════════════════════════════════════════════════════
//  STATUS PANEL (Admin)
// ══════════════════════════════════════════════════════════
const StatusPanel = ({week,subs,phone,setPhone}) => {
  if(!week) return <div className="alert-warn">No hay semana activa. Configurá una semana primero.</div>;
  const pend = DIVISIONS.filter(d=>subs[d.id]?.estado!=='enviado').length;

  // Detectar modificación DESPUÉS del envío (margen 5s para el propio submit)
  const wasModifiedAfterSend = (s) => {
    if(!s || s.estado!=='enviado') return false;
    const mod  = s.lastModifiedAt?.toMillis?.();
    const sent = s.enviadaEn?.toMillis?.();
    if(!mod || !sent) return false;
    return mod > sent + 5000;
  };

  const modPostEnvio = DIVISIONS.filter(d => wasModifiedAfterSend(subs[d.id]));

  return (
    <div>
      <div className="sec-t">Estado de Cargas — {week.label}</div>

      {/* ── ALERTA MODIFICACIONES POST-ENVÍO ── */}
      {modPostEnvio.length > 0 && (
        <div style={{background:'rgba(220,38,38,.07)',border:'1.5px solid rgba(220,38,38,.35)',borderRadius:'8px',padding:'14px 18px',marginBottom:'18px',display:'flex',alignItems:'flex-start',gap:'14px'}}>
          <span style={{fontSize:'28px',lineHeight:1}}>⚠️</span>
          <div>
            <div style={{fontFamily:'Oswald',fontSize:'15px',fontWeight:700,color:'var(--bad-l)',marginBottom:'5px'}}>
              Modificaciones posteriores al envío
            </div>
            <div style={{fontSize:'12px',color:'var(--muted)',lineHeight:1.6}}>
              <strong style={{color:'var(--text)'}}>{modPostEnvio.map(d=>d.abbr).join(', ')}</strong> {modPostEnvio.length===1?'modificó datos':'modificaron datos'} <strong style={{color:'var(--bad-l)'}}>después</strong> de haber enviado, sin notificarte. Revisá los datos antes de exportar.
            </div>
          </div>
        </div>
      )}

      <div style={{marginBottom:'18px'}}>
        <div style={{display:'inline-flex',alignItems:'center',gap:'12px',background:pend===0?'rgba(5,150,105,.1)':'rgba(217,119,6,.1)',border:`1px solid ${pend===0?'rgba(5,150,105,.3)':'rgba(217,119,6,.3)'}`,borderRadius:'8px',padding:'11px 18px'}}>
          <span style={{fontSize:'24px'}}>{pend===0?'✅':'⏳'}</span>
          <div>
            <div style={{fontFamily:'Oswald',fontSize:'15px',color:pend===0?'var(--ok-l)':'var(--accent-l)'}}>{pend===0?'Todas las cargas completas':`${pend} división${pend>1?'es':''} pendiente${pend>1?'s':''}`}</div>
            <div style={{fontSize:'11px',color:'var(--muted)'}}>{4-pend} de 4 divisiones enviaron</div>
          </div>
        </div>
      </div>

      <div className="div-cards">
        {DIVISIONS.map(d=>{
          const s=subs[d.id]; const ok=s?.estado==='enviado'; const n=s?.personal?.length||0;
          const nEvt = Object.values(s?.eventosExtra||{}).flat().length;
          const modWarn = wasModifiedAfterSend(s);
          const modStr  = s?.lastModifiedAt ? fmtDT(s.lastModifiedAt) : null;
          return (
            <div key={d.id} className={`div-card ${ok?'ok':'pend'}`}
              style={modWarn?{borderLeft:'4px solid var(--bad)',boxShadow:'0 0 0 2px rgba(220,38,38,.12)'}:{}}>
              <div className="dc-abbr" style={{color:d.color}}>{d.abbr}</div>
              <div className="dc-name">{d.name}</div>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'4px'}}>
                <span className={`sb ${ok?'sb-ok':'sb-p'}`}>{ok?'✓ Enviado':'● Pendiente'}</span>
                <span style={{fontSize:'11px',color:'var(--muted)'}}>{n} efectivos</span>
              </div>
              {nEvt>0&&<div style={{fontSize:'11px',color:'#60a5fa'}}>+ {nEvt} evento{nEvt>1?'s':''} propios</div>}
              {ok&&s?.enviadaEn&&<div className="dc-meta">📤 Enviado: {fmtDT(s.enviadaEn)}</div>}
              {/* Última modificación */}
              {modStr&&(
                <div style={{
                  marginTop:'6px', fontSize:'10px', fontFamily:'IBM Plex Mono, monospace',
                  color: modWarn ? 'var(--bad-l)' : 'var(--dim)',
                  background: modWarn ? 'rgba(220,38,38,.1)' : 'transparent',
                  borderRadius: modWarn ? '4px' : '0',
                  padding: modWarn ? '3px 6px' : '0',
                  fontWeight: modWarn ? 700 : 400,
                }}>
                  {modWarn ? '⚠ Modif. post-envío: ' : '✏ Últ. modif.: '}{modStr}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <div className="card">
        <div className="card-t" style={{fontSize:'13px'}}>📱 WhatsApp del Jefe (para notificaciones)</div>
        <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'9px'}}>Las divisiones podrán notificarte al completar su carga.</div>
        <div className="fg"><label>Número (con código país, sin +)</label><input type="text" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="5491155667788" style={{width:'230px'}}/></div>
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════
//  UNIFIED VIEW (Admin) — Ve todo
// ══════════════════════════════════════════════════════════
const UnifiedView = ({week,subs}) => {
  if(!week) return <div className="alert-warn">No hay semana activa.</div>;
  const dias = week.dias||[];
  // Max fixture events rows
  const maxFixture = Math.max(1,...dias.map(d=>(d.eventos||[]).length));

  return (
    <div>
      <div className="sec-t">Vista Unificada — {week.label}</div>
      <div className="grid-wrap">
        <table className="avt">
          <thead>
            {/* Fixture events header rows */}
            {Array(maxFixture).fill(null).map((_,ei)=>(
              <tr key={`f${ei}`} className="evt-row">
                <td colSpan={3}>{ei===0?'FIXTURE ADMIN':''}</td>
                {dias.map((d,di)=><td key={di}>{(d.eventos||[])[ei]||''}</td>)}
              </tr>
            ))}
            <tr>
              <th>JERARQUÍA</th><th>APELLIDO</th><th>NOMBRE</th>
              {dias.map((d,i)=>(
                <th key={i} className="dc" style={tintTh(diaInfo(week,d.label))}>
                  {d.label||`DÍA ${i+1}`}
                  {d.serial&&<div style={{fontSize:'9px',color:'rgba(255,255,255,.7)',fontFamily:'IBM Plex Mono',fontWeight:'normal'}}>{d.serial}</div>}
                  <DiaBadge inf={diaInfo(week,d.label)}/>
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {DIVISIONS.map(div=>{
              const s = subs[div.id]; const p = sortP(s?.personal||[]);
              const evExtra = s?.eventosExtra||{};
              // Max extra events rows for this division
              const maxEx = Math.max(0,...dias.map((_,i)=>(evExtra[String(i)]||[]).length));
              return (
                <React.Fragment key={div.id}>
                  {/* Division header */}
                  <tr className="div-hdr-row">
                    <td colSpan={3+dias.length} style={{borderLeft:`4px solid ${div.color}`}}>
                      {div.abbr} — {div.name.toUpperCase()}
                      <span className={`sb ${s?.estado==='enviado'?'sb-ok':'sb-p'}`} style={{marginLeft:'10px',fontSize:'10px'}}>{s?.estado==='enviado'?'✓ Enviado':'Pendiente'}</span>
                      <span style={{fontSize:'11px',color:'var(--muted)',marginLeft:'12px'}}>{p.length} efectivos</span>
                    </td>
                  </tr>
                  {/* Extra events rows for this division */}
                  {maxEx>0&&Array(maxEx).fill(null).map((_,ei)=>(
                    <tr key={`ex${div.id}${ei}`} className="evt-row">
                      <td colSpan={3} style={{color:'#60a5fa'}}>{ei===0?`+ eventos ${div.abbr}`:''}</td>
                      {dias.map((_,di)=><td key={di} style={{color:'#60a5fa'}}>{(evExtra[String(di)]||[])[ei]||''}</td>)}
                    </tr>
                  ))}
                  {/* Personnel rows */}
                  {p.length===0&&(
                    <tr><td colSpan={3+dias.length} style={{textAlign:'center',color:'var(--dim)',padding:'9px',fontStyle:'italic',fontSize:'12px'}}>Sin datos cargados</td></tr>
                  )}
                  {p.map(per=>(
                    <tr key={per.id}>
                      <td style={{fontSize:'11px',color:'var(--muted)',whiteSpace:'nowrap'}}>{per.jerarquia}</td>
                      <td style={{fontWeight:600,whiteSpace:'nowrap'}}>{per.apellido}</td>
                      <td style={{whiteSpace:'nowrap'}}>{per.nombre}</td>
                      {dias.map((_,di)=>{ const v=(per.disponibilidad||{})[String(di)]||''; return <td key={di} style={{textAlign:'center',fontFamily:'IBM Plex Mono',fontSize:'11px',color:avColor(v)}}>{v}</td>; })}
                    </tr>
                  ))}
                </React.Fragment>
              );
            })}
          </tbody>
          <tfoot>
            {/* Subtotales por division */}
            {DIVISIONS.map(div=>{
              const p=subs[div.id]?.personal||[];
              if(p.length===0) return null;
              return (
                <tr key={div.id} style={{borderTop:'1px solid var(--border)'}}>
                  <td colSpan={3} style={{padding:'4px 8px',fontSize:'11px',fontWeight:600,color:div.color,fontFamily:'Oswald',letterSpacing:'.5px',background:'#f8fafc'}}>
                    {div.abbr} DISP.
                  </td>
                  {dias.map((_,di)=>{
                    const cnt=p.filter(per=>(per.disponibilidad||{})[String(di)]==='DISPONIBLE').length;
                    return <td key={di} style={{textAlign:'center',fontFamily:'IBM Plex Mono',fontSize:'12px',fontWeight:700,color:cnt>0?'#059669':'var(--dim)',background:'#f8fafc',padding:'4px'}}>{cnt||'-'}</td>;
                  })}
                </tr>
              );
            })}
            {/* Fila total general */}
            <tr style={{borderTop:'2px solid var(--primary)'}}>
              <td colSpan={3} style={{padding:'6px 8px',fontSize:'12px',fontWeight:700,color:'var(--primary)',fontFamily:'Oswald',letterSpacing:'.8px',background:'#eef2ff'}}>TOTAL DISPONIBLES</td>
              {dias.map((_,di)=>{
                const total=DIVISIONS.reduce((acc,div)=>{
                  const p=subs[div.id]?.personal||[];
                  return acc+p.filter(per=>(per.disponibilidad||{})[String(di)]==='DISPONIBLE').length;
                },0);
                return <td key={di} style={{textAlign:'center',fontFamily:'IBM Plex Mono',fontSize:'14px',fontWeight:800,color:total>0?'var(--primary)':'var(--dim)',background:'#eef2ff',padding:'6px'}}>{total||'-'}</td>;
              })}
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════
//  EXPORT PANEL (Admin)
// ══════════════════════════════════════════════════════════
const ExportPanel = ({week,subs}) => {
  const [exp,setExp] = useState(false);
  const go = async () => {
    if(!week){toast('bad','Error','No hay semana activa');return;}
    setExp(true);
    try{
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Disponibles');
      const dias = week.dias||[];
      const maxFixture = Math.max(1,...dias.map(d=>(d.eventos||[]).length));
      ws.getColumn(1).width=18; ws.getColumn(2).width=18; ws.getColumn(3).width=16;
      dias.forEach((_,i)=>{ ws.getColumn(4+i).width=26; });
      const BLU={type:'pattern',pattern:'solid',fgColor:{argb:'FF1E3A8A'}};
      const EVT={type:'pattern',pattern:'solid',fgColor:{argb:'FF0F172A'}};
      const DIV={type:'pattern',pattern:'solid',fgColor:{argb:'FF21262D'}};
      const EXT={type:'pattern',pattern:'solid',fgColor:{argb:'FF0F1E3A'}};
      // Fixture rows
      for(let ei=0;ei<maxFixture;ei++){
        const row = ws.addRow([ei===0?'FIXTURE':'',' ',' ',...dias.map(d=>(d.eventos||[])[ei]||'')]);
        row.eachCell(c=>{ c.fill=EVT; c.font={color:{argb:'FF8B949E'},size:9,name:'Calibri'}; c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; });
        row.height=16;
      }
      // Day labels
      const lr = ws.addRow(['JERARQUÍA','APELLIDO','NOMBRE',...dias.map(d=>d.label+(d.serial?`\n${d.serial}`:''))]);
      lr.eachCell(c=>{ c.fill=BLU; c.font={bold:true,color:{argb:'FFFFFFFF'},size:10,name:'Calibri'}; c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; c.border={bottom:{style:'thin',color:{argb:'FF0F172A'}}}; });
      lr.height=22; xlMarcarDias(lr,dias,week); xlHoja(ws,lr.number);
      // Divisions
      DIVISIONS.forEach(div=>{
        const s=subs[div.id]; const p=sortP(s?.personal||[]); const evExtra=s?.eventosExtra||{};
        const dr = ws.addRow([div.abbr,div.name,'',...dias.map(()=>'')]);
        ws.mergeCells(dr.number,1,dr.number,3);
        dr.eachCell(c=>{ c.fill=DIV; c.font={bold:true,color:{argb:'FFFBBF24'},size:11,name:'Calibri'}; c.alignment={horizontal:'left',vertical:'middle'}; });
        dr.height=18;
        // Extra events rows for this division
        const maxEx=Math.max(0,...dias.map((_,i)=>(evExtra[String(i)]||[]).length));
        for(let ei=0;ei<maxEx;ei++){
          const er=ws.addRow([ei===0?`+ Eventos ${div.abbr}`:'',' ',' ',...dias.map((_,di)=>(evExtra[String(di)]||[])[ei]||'')]);
          er.eachCell(c=>{ c.fill=EXT; c.font={color:{argb:'FF60A5FA'},size:9,name:'Calibri'}; c.alignment={horizontal:'center',vertical:'middle'}; });
          er.height=14;
        }
        p.forEach((per,pi)=>{
          const row=ws.addRow([per.jerarquia,per.apellido.toUpperCase(),per.nombre.toUpperCase(),...dias.map((_,di)=>(per.disponibilidad||{})[String(di)]||'')]);
          const alt=pi%2!==0;
          row.eachCell((c,col)=>{
            if(col<4){
              c.fill={type:'pattern',pattern:'solid',fgColor:{argb:alt?'FFF8FAFC':'FFFFFFFF'}};
              c.font={size:10,name:'Calibri',color:{argb:'FF1E293B'}};
              c.alignment={horizontal:'left',vertical:'middle'};
              c.border={bottom:{style:'hair',color:{argb:'FFE2E8F0'}}};
            } else { estiloAsignacion(c, alt); }
          });
          row.height=17;
        });
        xlTotales(ws,p,dias);
        ws.addRow(['','',...dias.map(()=>'')]).height=6;
      });
      const buf=await wb.xlsx.writeBuffer();
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
      a.download=`DISPONIBLES_DPEM_${week.label.replace(/\s+/g,'_')}.xlsx`; a.click();
      toast('ok','Excel generado',`${week.label}.xlsx`);
    }catch(e){toast('bad','Error al exportar',e.message);}
    setExp(false);
  };
  if(!week) return <div className="alert-warn">No hay semana activa.</div>;
  const total=DIVISIONS.reduce((a,d)=>a+(subs[d.id]?.personal?.length||0),0);
  const sent=DIVISIONS.filter(d=>subs[d.id]?.estado==='enviado').length;
  return (
    <div>
      <div className="sec-t">Exportar — {week.label}</div>
      <div className="card">
        <div className="card-t">📊 Exportar a Excel (.xlsx)</div>
        <div className="stat-tiles">
          {[{l:'Semana',v:week.label,sm:true},{l:'Divisiones enviadas',v:`${sent} / 4`},{l:'Total efectivos',v:`${total}`}].map(x=><div key={x.l} className="tile"><div className="tile-l">{x.l}</div><div className="tile-v" style={{fontSize:x.sm?'14px':'22px'}}>{x.v}</div></div>)}
        </div>
        {sent<4&&<div style={{background:'rgba(217,119,6,.1)',border:'1px solid rgba(217,119,6,.3)',borderRadius:'6px',padding:'9px 13px',fontSize:'12px',color:'var(--accent-l)',marginBottom:'14px'}}>⚠ {4-sent} división{4-sent>1?'es':''} aún no enviaron. El Excel incluirá los datos actuales.</div>}
        <button className="btn btn-ok btn-lg" onClick={go} disabled={exp}>{exp?'⏳ Generando Excel...':'⬇ Descargar Excel (.xlsx)'}</button>
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════
//  ADMIN ROSTER EDITOR — alta / edición / baja manual de efectivos
// ══════════════════════════════════════════════════════════
const AdminRosterEditor = ({personal, onChange, disabled}) => {
  const [form,setForm] = useState({jerarquia:'Inspector',apellido:'',nombre:''});
  const [eid,setEid]   = useState(null);
  const reset = () => { setEid(null); setForm({jerarquia:'Inspector',apellido:'',nombre:''}); };

  const add = () => {
    if(!form.apellido.trim()){ toast('bad','Error','Ingresá el apellido'); return; }
    const jer=form.jerarquia, ape=form.apellido.trim().toUpperCase(), nom=form.nombre.trim().toUpperCase();
    if(eid){
      onChange(personal.map(p=>p.id===eid?{...p,jerarquia:jer,apellido:ape,nombre:nom}:p));
    } else {
      onChange([...personal,{id:uid(),jerarquia:jer,apellido:ape,nombre:nom,disponibilidad:{}}]);
    }
    reset();
  };
  const del = id => {
    if(!window.confirm('¿Eliminar este efectivo de la nómina?')) return;
    onChange(personal.filter(p=>p.id!==id));
    if(eid===id) reset();
  };
  const edit = p => { setForm({jerarquia:p.jerarquia,apellido:p.apellido,nombre:p.nombre}); setEid(p.id); };

  const sorted = sortP(personal);
  return (
    <div>
      <div className="frow" style={{marginBottom:'12px',alignItems:'flex-end'}}>
        <div className="fg"><label>Jerarquía</label>
          <select value={form.jerarquia} disabled={disabled} onChange={e=>setForm(f=>({...f,jerarquia:e.target.value}))}>{JERARQUIAS.map(j=><option key={j}>{j}</option>)}</select>
        </div>
        <div className="fg"><label>Apellido</label>
          <input type="text" value={form.apellido} disabled={disabled} onChange={e=>setForm(f=>({...f,apellido:e.target.value.toUpperCase()}))} placeholder="APELLIDO" style={{width:'150px'}}/>
        </div>
        <div className="fg"><label>Nombre</label>
          <input type="text" value={form.nombre} disabled={disabled} onChange={e=>setForm(f=>({...f,nombre:e.target.value.toUpperCase()}))} placeholder="NOMBRE" style={{width:'150px'}}/>
        </div>
        <div style={{display:'flex',gap:'7px'}}>
          <button className="btn btn-p btn-sm" onClick={add} disabled={disabled}>{eid?'✓ Actualizar':'+ Agregar'}</button>
          {eid&&<button className="btn btn-ghost btn-sm" onClick={reset} disabled={disabled}>Cancelar</button>}
        </div>
      </div>
      <div style={{maxHeight:'250px',overflow:'auto',border:'1px solid var(--border)',borderRadius:'6px'}}>
        <table className="personnel-table" style={{fontSize:'12px'}}>
          <thead><tr><th>#</th><th>Jerarquía</th><th>Apellido</th><th>Nombre</th><th style={{width:'70px',textAlign:'center'}}>Acc.</th></tr></thead>
          <tbody>
            {sorted.map((p,i)=>(
              <tr key={p.id} style={eid===p.id?{background:'rgba(29,78,216,.07)'}:null}>
                <td style={{color:'var(--dim)',width:'30px'}}>{i+1}</td>
                <td style={{fontSize:'11px',color:'var(--muted)'}}>{p.jerarquia}</td>
                <td style={{fontWeight:600}}>{p.apellido}</td>
                <td>{p.nombre}</td>
                <td><div style={{display:'flex',gap:'4px',justifyContent:'center'}}>
                  <button className="btn btn-ghost btn-sm" onClick={()=>edit(p)} disabled={disabled} title="Editar">✏</button>
                  <button className="btn btn-bad btn-sm" onClick={()=>del(p.id)} disabled={disabled} title="Eliminar">✕</button>
                </div></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════
//  ADMIN NÓMINA — importar efectivos por división
// ══════════════════════════════════════════════════════════
const AdminNomina = ({week, subs}) => {
  // preview[divId] = array of parsed rows pending confirmation
  const [previews,     setPreviews]     = useState({});
  const [modes,        setModes]        = useState({});   // merge | replace per div
  const [saving,       setSaving]       = useState({});
  const [expanded,     setExpanded]     = useState({});
  const [savedNominas, setSavedNominas] = useState({});   // global nominas
  const [restoring,    setRestoring]    = useState(false);

  // Cargar nóminas globales guardadas
  useEffect(()=>{
    const unsubs = DIVISIONS.map(div =>
      db.collection('nominas').doc(div.id).onSnapshot(snap=>{
        if(snap.exists && snap.data().personal?.length){
          setSavedNominas(p=>({...p,[div.id]:snap.data().personal}));
        } else {
          setSavedNominas(p=>{ const n={...p}; delete n[div.id]; return n; });
        }
      })
    );
    return ()=>unsubs.forEach(u=>u());
  },[]);

  // Restaurar todas las nóminas guardadas a la semana actual
  const restoreAll = async () => {
    if(!week) return;
    const divsPend = DIVISIONS.filter(d => savedNominas[d.id] && !(subs[d.id]?.personal?.length));
    if(!divsPend.length){ toast('info','Sin cambios','Todas las divisiones ya tienen nómina cargada o no hay nóminas guardadas.'); return; }
    if(!window.confirm(`¿Restaurar nóminas guardadas para: ${divsPend.map(d=>d.abbr).join(', ')}?\nSe copiarán los efectivos de la última nómina importada.`)) return;
    setRestoring(true);
    try{
      await Promise.all(divsPend.map(div =>
        db.collection('semanas').doc(week.id).collection('divisiones').doc(div.id)
          .set({personal: savedNominas[div.id]},{merge:true})
      ));
      toast('ok','Nóminas restauradas',`${divsPend.length} divisiones actualizadas`);
    }catch(e){ toast('bad','Error al restaurar',e.message); }
    setRestoring(false);
  };

  const restoreDiv = async (divId) => {
    if(!week || !savedNominas[divId]) return;
    setSaving(p=>({...p,[divId]:true}));
    try{
      await db.collection('semanas').doc(week.id).collection('divisiones').doc(divId)
        .set({personal: savedNominas[divId]},{merge:true});
      const div = DIVISIONS.find(d=>d.id===divId);
      toast('ok',`Nómina ${div?.abbr} restaurada`,`${savedNominas[divId].length} efectivos`);
    }catch(e){ toast('bad','Error',e.message); }
    setSaving(p=>({...p,[divId]:false}));
  };

  if(!week) return <div className="alert-warn">No hay semana activa. Activá una semana primero para poder cargar la nómina.</div>;

  const parseFile = (file, divId) => new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      try{
        const wb   = XLSX.read(e.target.result,{type:'array'});
        const ws   = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        const detected = [];
        for(const row of rows){
          const col0 = String(row[0]||'').trim();
          const matchJ = JERARQUIAS.find(j=>j.toLowerCase()===col0.toLowerCase());
          if(matchJ && String(row[1]||'').trim())
            detected.push({id:uid(), jerarquia:matchJ, apellido:String(row[1]||'').trim().toUpperCase(), nombre:String(row[2]||'').trim().toUpperCase(), disponibilidad:{}});
        }
        resolve(detected);
      }catch(err){reject(err);}
    };
    reader.readAsArrayBuffer(file);
  });

  const handleFile = async (e, divId) => {
    const file = e.target.files[0];
    e.target.value = '';
    if(!file) return;
    try{
      const rows = await parseFile(file, divId);
      if(!rows.length){ toast('bad','Sin datos','No se encontraron filas con jerarquías válidas en la columna A.'); return; }
      setPreviews(p=>({...p,[divId]:rows}));
      setModes(p=>({...p,[divId]:p[divId]||'merge'}));
    }catch(err){ toast('bad','Error al leer el archivo',err.message); }
  };

  const applyImport = async (divId) => {
    const rows    = previews[divId];
    const mode    = modes[divId]||'merge';
    const current = subs[divId]?.personal||[];
    let final;
    if(mode==='replace'){
      const divN=DIVISIONS.find(d=>d.id===divId)?.abbr||divId;
      if(!window.confirm(`¿Reemplazar TODA la nómina de ${divN}?\n`+
        `Esto eliminará los ${current.length} efectivos actuales reemplazándolos con los ${rows.length} del archivo.\n`+
        `Esta acción no se puede deshacer.`)) return;
      final = rows;
    } else {
      const existing = new Set(current.map(p=>`${p.apellido}|${p.nombre}`));
      final = [...current, ...rows.filter(r=>!existing.has(`${r.apellido}|${r.nombre}`))];
    }
    setSaving(p=>({...p,[divId]:true}));
    try{
      await db.collection('semanas').doc(week.id).collection('divisiones').doc(divId)
        .set({personal:final},{merge:true});
      // Guardar también como nómina global (persistente entre semanas), solo el roster
      await db.collection('nominas').doc(divId).set({personal:soloRoster(final)},{merge:true});
      audNow({weekId:week.id,weekLabel:week.label,div:DIVISIONS.find(d=>d.id===divId)?.abbr,by:'DSED'},{k:'nom',x:`Importó nómina (${mode==='replace'?'reemplazo total':'agregar nuevos'}, ${rows.length} filas)`});
      const added = mode==='replace' ? rows.length : final.length - current.length;
      toast('ok',`Nómina ${DIVISIONS.find(d=>d.id===divId)?.abbr} actualizada`, mode==='replace'?`${rows.length} efectivos cargados`:`${added} efectivos nuevos agregados`);
      setPreviews(p=>({...p,[divId]:null}));
    }catch(err){ toast('bad','Error al guardar',err.message); }
    setSaving(p=>({...p,[divId]:false}));
  };

  const clearDiv = async (divId) => {
    const div = DIVISIONS.find(d=>d.id===divId);
    if(!window.confirm(`¿Limpiar toda la nómina de ${div?.abbr}? Se eliminan todos los efectivos de esta semana.`)) return;
    setSaving(p=>({...p,[divId]:true}));
    try{
      await db.collection('semanas').doc(week.id).collection('divisiones').doc(divId)
        .set({personal:[]},{merge:true});
      audNow({weekId:week.id,weekLabel:week.label,div:div?.abbr,by:'DSED'},{k:'nom',x:'Limpió toda la nómina'});
      toast('ok','Nómina limpiada',div?.abbr);
    }catch(err){ toast('bad','Error',err.message); }
    setSaving(p=>({...p,[divId]:false}));
  };

  // Guardar edición manual del roster: a la semana en curso Y a la nómina maestra
  const saveRoster = async (divId, np) => {
    if(!week) return;
    setSaving(p=>({...p,[divId]:true}));
    try{
      await db.collection('semanas').doc(week.id).collection('divisiones').doc(divId)
        .set({personal:np},{merge:true});
      await db.collection('nominas').doc(divId).set({personal:soloRoster(np)},{merge:true});
      audPush({weekId:week.id,weekLabel:week.label,div:DIVISIONS.find(d=>d.id===divId)?.abbr,by:'DSED'},{k:'nom',x:'Editó la nómina'},`nom|${divId}`);
    }catch(err){ toast('bad','Error al guardar',err.message); }
    setSaving(p=>({...p,[divId]:false}));
  };

  const pendRestore = DIVISIONS.filter(d => savedNominas[d.id] && !(subs[d.id]?.personal?.length));

  return(
    <div>
      <div className="sec-t">Nómina de Efectivos — {week.label}</div>

      {/* Banner restaurar nóminas */}
      {pendRestore.length > 0 && (
        <div style={{background:'rgba(5,150,105,.09)',border:'1px solid rgba(5,150,105,.3)',borderRadius:'8px',padding:'12px 16px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'14px',flexWrap:'wrap'}}>
          <span style={{fontSize:'20px'}}>📋</span>
          <div style={{flex:1}}>
            <div style={{fontFamily:'Oswald',fontSize:'14px',fontWeight:700,color:'var(--ok-l)',marginBottom:'2px'}}>Nóminas guardadas disponibles</div>
            <div style={{fontSize:'12px',color:'var(--muted)'}}>
              {pendRestore.map(d=>d.abbr).join(', ')} — sin personal en esta semana. Podés restaurar con un clic.
            </div>
          </div>
          <button className="btn btn-ok" onClick={restoreAll} disabled={restoring}>
            {restoring ? '⏳ Restaurando...' : `📥 Restaurar ${pendRestore.length > 1 ? 'todas' : pendRestore[0].abbr}`}
          </button>
        </div>
      )}

      <div style={{fontSize:'12px',color:'var(--muted)',background:'rgba(29,78,216,.06)',border:'1px solid rgba(29,78,216,.2)',borderRadius:'6px',padding:'8px 12px',marginBottom:'20px'}}>
        ℹ La nómina se pre-carga automáticamente al crear/activar cada semana. Usá <strong style={{color:'var(--text)'}}>Importar Excel</strong> solo si hubo cambios de efectivos. Formato: <strong style={{color:'var(--text)'}}>Col A:</strong> Jerarquía &nbsp;|&nbsp; <strong style={{color:'var(--text)'}}>Col B:</strong> Apellido &nbsp;|&nbsp; <strong style={{color:'var(--text)'}}>Col C:</strong> Nombre
      </div>

      {DIVISIONS.map(div=>{
        const current   = sortP(subs[div.id]?.personal||[]);
        const preview   = previews[div.id];
        const mode      = modes[div.id]||'merge';
        const isSaving  = saving[div.id];
        const isExpanded= expanded[div.id];

        return(
          <div key={div.id} className="card" style={{borderLeft:`4px solid ${div.color}`,marginBottom:'14px'}}>
            {/* HEADER */}
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'10px',marginBottom: preview||isExpanded?'14px':'0'}}>
              <div>
                <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                  <span style={{fontFamily:'Oswald',fontSize:'16px',fontWeight:700,color:div.color}}>{div.abbr}</span>
                  <span style={{fontSize:'12px',color:'var(--muted)'}}>{div.name}</span>
                </div>
                <div style={{fontSize:'12px',color:'var(--muted)',marginTop:'3px'}}>
                  {current.length > 0
                    ? <span><strong style={{color:'var(--text)'}}>{current.length}</strong> efectivos cargados</span>
                    : <span style={{color:'var(--dim)'}}>Sin nómina cargada</span>}
                  {savedNominas[div.id] && (
                    <span style={{marginLeft:'8px',color:'var(--ok-l)',fontSize:'11px'}}>
                      ✓ guardada ({savedNominas[div.id].length} ef.)
                    </span>
                  )}
                </div>
              </div>
              <div style={{display:'flex',gap:'7px',alignItems:'center',flexWrap:'wrap'}}>
                {current.length>0&&(
                  <button className="btn btn-ghost btn-sm" onClick={()=>setExpanded(p=>({...p,[div.id]:!p[div.id]}))}>
                    {isExpanded?'▲ Ocultar':'✏ Ver / editar nómina'}
                  </button>
                )}
                {current.length===0&&(
                  <button className="btn btn-g btn-sm" onClick={()=>setExpanded(p=>({...p,[div.id]:!p[div.id]}))}>
                    {isExpanded?'▲ Ocultar':'✏ Cargar a mano'}
                  </button>
                )}
                {current.length>0&&(
                  <button className="btn btn-bad btn-sm" onClick={()=>clearDiv(div.id)} disabled={isSaving}>
                    🗑 Limpiar
                  </button>
                )}
                {current.length===0 && savedNominas[div.id] && (
                  <button className="btn btn-ok btn-sm" onClick={()=>restoreDiv(div.id)} disabled={isSaving} title={`Restaurar nómina guardada (${savedNominas[div.id].length} efectivos)`}>
                    📋 Usar guardada ({savedNominas[div.id].length} ef.)
                  </button>
                )}
                <label className="btn btn-p btn-sm" style={{cursor:'pointer'}}>
                  📥 Importar Excel
                  <input type="file" accept=".xlsx,.xls,.ods" style={{display:'none'}} onChange={e=>handleFile(e,div.id)}/>
                </label>
              </div>
            </div>

            {/* PREVIEW */}
            {preview&&(
              <div style={{borderTop:'1px solid var(--border)',paddingTop:'12px'}}>
                <div style={{fontSize:'13px',color:'var(--ok-l)',marginBottom:'10px',display:'flex',alignItems:'center',gap:'8px'}}>
                  <span>✓ {preview.length} efectivos detectados en el archivo</span>
                </div>
                <div style={{display:'flex',gap:'8px',marginBottom:'12px',alignItems:'center',flexWrap:'wrap'}}>
                  <span style={{fontSize:'12px',color:'var(--muted)'}}>Modo:</span>
                  {[['merge','Agregar a los existentes'],['replace','Reemplazar toda la nómina']].map(([m,l])=>(
                    <button key={m} className={`btn btn-sm ${mode===m?'btn-p':'btn-ghost'}`} onClick={()=>setModes(p=>({...p,[div.id]:m}))}>{l}</button>
                  ))}
                </div>
                {mode==='replace'&&current.length>0&&(
                  <div style={{background:'rgba(220,38,38,.08)',border:'1px solid rgba(220,38,38,.25)',borderRadius:'5px',padding:'7px 11px',fontSize:'11px',color:'var(--bad-l)',marginBottom:'10px'}}>
                    ⚠ Esto reemplazará la nómina actual de {current.length} efectivos.
                  </div>
                )}
                <div style={{maxHeight:'220px',overflow:'auto',marginBottom:'12px',border:'1px solid var(--border)',borderRadius:'6px'}}>
                  <table className="personnel-table" style={{fontSize:'12px'}}>
                    <thead><tr><th>#</th><th>Jerarquía</th><th>Apellido</th><th>Nombre</th></tr></thead>
                    <tbody>
                      {preview.map((p,i)=>(
                        <tr key={p.id}>
                          <td style={{color:'var(--dim)',width:'30px'}}>{i+1}</td>
                          <td style={{fontSize:'11px',color:'var(--muted)'}}>{p.jerarquia}</td>
                          <td style={{fontWeight:600}}>{p.apellido}</td>
                          <td>{p.nombre}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
                <div style={{display:'flex',gap:'8px'}}>
                  <button className="btn btn-ok" onClick={()=>applyImport(div.id)} disabled={isSaving}>
                    {isSaving?'⏳ Guardando...':'✓ Confirmar importación'}
                  </button>
                  <button className="btn btn-ghost btn-sm" onClick={()=>setPreviews(p=>({...p,[div.id]:null}))}>Cancelar</button>
                </div>
              </div>
            )}

            {/* EDITOR DE NÓMINA (alta/edición/baja manual) */}
            {!preview&&isExpanded&&(
              <div style={{borderTop:'1px solid var(--border)',paddingTop:'12px'}}>
                <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'10px'}}>
                  Editá la nómina manualmente. Los cambios se guardan en <strong style={{color:'var(--text)'}}>esta semana</strong> y en la <strong style={{color:'var(--text)'}}>nómina maestra</strong> (se pre-carga en las próximas semanas).
                </div>
                <AdminRosterEditor
                  personal={subs[div.id]?.personal||[]}
                  onChange={np=>saveRoster(div.id,np)}
                  disabled={isSaving}
                />
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
};

// ══════════════════════════════════════════════════════════
//  ADMIN EDIT DISPONIBILIDAD — edita cualquier división
// ══════════════════════════════════════════════════════════
const AdminEditDisp = ({week, subs}) => {
  const [selDiv,  setSelDiv]   = useState(DIVISIONS[0].id);
  const [personal,setPersonal] = useState([]);
  const [saving,  setSaving]   = useState(false);

  // Cuando cambia la división seleccionada, cargamos su personal desde subs
  const selectDiv = (divId) => {
    setSelDiv(divId);
    setPersonal(subs[divId]?.personal || []);
  };

  // Sincronizar si subs cambia externamente (la división editó algo mientras el admin también)
  useEffect(() => {
    setPersonal(subs[selDiv]?.personal || []);
  }, [selDiv]); // solo al cambiar de división para no pisar cambios en curso

  if(!week) return <div className="alert-warn">No hay semana activa.</div>;

  const div = DIVISIONS.find(d => d.id === selDiv);
  const estado = subs[selDiv]?.estado || 'pendiente';

  const handleChange = async (newPersonal) => {
    audDiff({weekId:week.id,weekLabel:week.label,div:DIVISIONS.find(d=>d.id===selDiv)?.abbr,by:'DSED'},personal,newPersonal,week);
    setPersonal(newPersonal);
    setSaving(true);
    try {
      await db.collection('semanas').doc(week.id)
        .collection('divisiones').doc(selDiv)
        .set({personal: newPersonal}, {merge: true});
    } catch(e) { toast('bad','Error al guardar',e.message); }
    setSaving(false);
  };

  return (
    <div>
      <div className="sec-t">Editar Disponibilidad — {week.label}</div>

      {/* Selector de división */}
      <div style={{display:'flex',gap:'8px',marginBottom:'18px',flexWrap:'wrap',alignItems:'center'}}>
        {DIVISIONS.map(d => {

          return (
            <button key={d.id}
              onClick={() => selectDiv(d.id)}
              style={{
                padding:'8px 14px', borderRadius:'6px', border:`2px solid ${isActive?d.color:'var(--border)'}`,
                background: isActive ? d.color+'22' : 'var(--surface)',
                color: isActive ? d.color : 'var(--muted)',
                cursor:'pointer', fontFamily:'IBM Plex Sans, sans-serif', fontSize:'13px',
                fontWeight: isActive ? 700 : 500, transition:'all .2s',
                display:'flex', alignItems:'center', gap:'7px'
              }}>
              <span style={{fontFamily:'Oswald, sans-serif',fontSize:'14px'}}>{d.abbr}</span>
              <span style={{fontSize:'11px',opacity:.8}}>{n} ef.</span>
              {ok && <span style={{fontSize:'9px',background:'rgba(5,150,105,.2)',color:'var(--ok-l)',padding:'1px 5px',borderRadius:'8px'}}>✓</span>}
            </button>
          );
        })}
        {saving && <span style={{fontSize:'11px',color:'var(--muted)',marginLeft:'4px'}}>💾 Guardando...</span>}
      </div>

      {/* Info de la división seleccionada */}
      <div style={{display:'flex',alignItems:'center',gap:'10px',marginBottom:'14px',padding:'8px 12px',background:'var(--card)',border:'1px solid var(--border)',borderRadius:'6px',borderLeft:`3px solid ${div?.color}`}}>
        <span style={{fontFamily:'Oswald,sans-serif',fontWeight:700,color:div?.color}}>{div?.abbr}</span>
        <span style={{fontSize:'12px',color:'var(--muted)',flex:1}}>{div?.name}</span>
        <span className={`sb ${estado==='enviado'?'sb-ok':'sb-p'}`}>{estado==='enviado'?'✓ Enviado':'● Pendiente'}</span>
        {estado==='enviado' && (
          <span style={{fontSize:'11px',color:'var(--muted)'}}>
            Podés editar igual — el estado no cambia automáticamente.

const DivisionApp = ({div, onLogout}) => {
  const [tab,setTab] = useState('personal');
  const [week,setWeek] = useState(null);
  const [data,setData] = useState({estado:'pendiente',personal:[],eventosExtra:{}});
  const [saving,setSaving] = useState(false);
  const [pendingSync,setPendingSync] = useState(false);   // hay cambios guardados local sin confirmar en la nube
  const [recover,setRecover] = useState(null);            // borrador local pendiente de decisión del usuario
  const [adminPh,setAdminPh] = useState(()=>localStorage.getItem('dpem_ph')||'');
  const [globalStatus,setGlobalStatus] = useState({});
  const [warnVac,setWarnVac] = useState(false);     // modal de celdas vacías
  const [resaltar,setResaltar] = useState(false);     // resaltar vacíos en la grilla
  const lastSaveId = useRef(null);
  const personalRef = useRef([]);   // último roster conocido (para detectar cambios de nómina)

  // ── AUTOSAVE / espejo en localStorage (a prueba de caídas de Firebase) ──
  const draftKey = week ? `dpem_draft_${week.id}_${div.id}` : null;
  const writeDraft = useCallback((partial, synced) => {
    if(!week) return;
    const key=`dpem_draft_${week.id}_${div.id}`;
    try{
      const prev=JSON.parse(localStorage.getItem(key)||'{}');
      localStorage.setItem(key, JSON.stringify({
        personal:     partial.personal!==undefined     ? partial.personal     : (prev.personal||[]),
        eventosExtra: partial.eventosExtra!==undefined  ? partial.eventosExtra  : (prev.eventosExtra||{}),
        savedAt: Date.now(),
        pendingSync: !synced,
      }));
    }catch{}
  },[week?.id,div.id]);

  // Cargar telefono del admin desde Firebase
  useEffect(()=>{
    db.collection('config').doc('global').get().then(snap=>{
      if(snap.exists && snap.data().phone){ setAdminPh(snap.data().phone); localStorage.setItem('dpem_ph',snap.data().phone); }
    }).catch(()=>{});
  },[]);

  // Escuchar estado de todas las divisiones
  useEffect(()=>{
    if(!week) return;
    const uns=DIVISIONS.map(d=>db.collection('semanas').doc(week.id).collection('divisiones').doc(d.id)
      .onSnapshot(snap=>{ const est=snap.exists?(snap.data().estado||'pendiente'):'pendiente'; setGlobalStatus(p=>({...p,[d.id]:est})); })
    );
    return()=>uns.forEach(u=>u());
  },[week?.id]);

  // Watch ONLY active week (fixture visible to all, but no other division data)
  useEffect(()=>db.collection('semanas').where('activa','==',true).onSnapshot(s=>{
    if(s.empty){setWeek(null);return;} const d=s.docs[0]; setWeek({id:d.id,...d.data()});
  }),[]);

  // Watch ONLY this division's own data
  useEffect(()=>{
    if(!week) return;
    return db.collection('semanas').doc(week.id).collection('divisiones').doc(div.id)
      .onSnapshot(s=>{
        if(!s.exists) return;
        const d=s.data();
        if(lastSaveId.current && d._saveId && d._saveId!==lastSaveId.current)
          toast('info','Datos sincronizados','El administrador modificó los datos. Vista actualizada.');
        setData(d);
        personalRef.current = d.personal||[];
        // Reconciliar con el borrador local: solo alertamos si hay cambios locales que NO llegaron a la nube
        try{
          const key=`dpem_draft_${week.id}_${div.id}`;
          const draft=JSON.parse(localStorage.getItem(key)||'null');
          if(draft && draft.pendingSync){
            const dif = JSON.stringify(d.personal||[])!==JSON.stringify(draft.personal||[])
                     || JSON.stringify(d.eventosExtra||{})!==JSON.stringify(draft.eventosExtra||{});
            if(dif){ setRecover(draft); }
            else { draft.pendingSync=false; localStorage.setItem(key,JSON.stringify(draft)); setPendingSync(false); }
          }
        }catch{}
      });
  },[week?.id]);

  // Reenvío automático del borrador local al recuperar conexión
  useEffect(()=>{
    const flush=()=>{
      if(!week) return;
      try{
        const key=`dpem_draft_${week.id}_${div.id}`;
        const draft=JSON.parse(localStorage.getItem(key)||'null');
        if(draft && draft.pendingSync){
          persist({personal:draft.personal||[], eventosExtra:draft.eventosExtra||{}});
        }
      }catch{}
    };
    window.addEventListener('online',flush);
    return ()=>window.removeEventListener('online',flush);
  },[week?.id,persist]);

  const persist = useCallback(async (update) => {
    if(!week) return;
    // 1) Espejo local inmediato (sobrevive aunque falle Firebase o se cierre la pestaña)
    writeDraft(update, false);
    setSaving(true);
    try{
      const saveId=Math.random().toString(36).substr(2,9);
      lastSaveId.current=saveId;
      await db.collection('semanas').doc(week.id).collection('divisiones').doc(div.id).set({
        ...update,
        _saveId:saveId,
        lastModifiedAt: firebase.firestore.FieldValue.serverTimestamp(),
        lastModifiedBy: div.abbr,
      },{merge:true});
      // 2) Confirmado en la nube
      writeDraft(update, true);
      setPendingSync(false);
    }catch(e){
      // 3) Falló la nube: el borrador local queda como respaldo
      setPendingSync(true);
      toast('bad','Sin conexión — guardado local','Tus cambios quedaron en este dispositivo y se reenviarán al reconectar.');
    }
    setSaving(false);
  },[week?.id,div.id,writeDraft]);

  const savePersonal = useCallback((np) => {
    // Si cambió el ROSTER (alta/baja/edición de efectivos, no la disponibilidad),
    // actualizar la nómina maestra para que las próximas semanas la pre-carguen al día.
    if(rosterSig(np) !== rosterSig(personalRef.current)){
      db.collection('nominas').doc(div.id)
        .set({personal: soloRoster(np)},{merge:true})
        .catch(()=>{});
    }
    audDiff({weekId:week?.id,weekLabel:week?.label,div:div.abbr,by:div.abbr},personalRef.current,np,week);
    personalRef.current = np;
    setData(p=>({...p,personal:np}));
    persist({personal:np});
  },[persist,div.id,week]);

  const saveEventos = useCallback((ee) => {
    setData(p=>{ audEvDiff({weekId:week?.id,weekLabel:week?.label,div:div.abbr,by:div.abbr},p.eventosExtra,ee,week); return {...p,eventosExtra:ee}; });
    persist({eventosExtra:ee});
  },[persist,week,div.abbr]);

  const submit = async (force) => {
    if(!week){toast('bad','Error','No hay semana activa');return;}
    if((data.personal||[]).length===0){toast('bad','Error','No hay efectivos cargados');return;}
    if(!adminPh){
      toast('bad','Falta el WhatsApp del DSED','No se puede enviar sin poder avisar. Pedile al administrador que configure el número de contacto.');
      return;
    }
    // Aviso: celdas sin completar (se puede enviar igual)
    if(force!==true && calcVacios(data.personal||[],week).length>0){ setWarnVac(true); return; }
    if(!confirm('¿Confirmar envío de disponibilidades?\n\nSe abrirá WhatsApp para avisar al DSED que la planilla fue enviada. Tenés que enviar ese mensaje.')) return;
    // Reservar la pestaña DENTRO del gesto del click para que el navegador no bloquee el popup
    const waWin = window.open('', '_blank');
    setSaving(true);
    try{
      await db.collection('semanas').doc(week.id).collection('divisiones').doc(div.id)
        .set({estado:'enviado',enviadaEn:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      const hora=new Date().toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
      const msg=`✅ *PLANILLA ENVIADA*\n${div.abbr} — ${div.name}\nSemana: ${week.label}\nEfectivos: ${data.personal.length}\nHora: ${hora}`;
      const url=`https://wa.me/${adminPh}?text=${encodeURIComponent(msg)}`;
      if(waWin && !waWin.closed){ waWin.location.href=url; } else { window.open(url,'_blank'); }
      audNow({weekId:week.id,weekLabel:week.label,div:div.abbr,by:div.abbr},{k:'est',x:'Envió la planilla'});
      toast('ok','Carga enviada','Enviá el WhatsApp que se abrió para avisar al DSED.');
      setTab('enviar');
    }catch(e){
      if(waWin && !waWin.closed) waWin.close();
      toast('bad','Error al enviar',e.message);
    }
    setSaving(false);
  };

  const reopen = async () => {
    if(!confirm('¿Reabrir la carga? El administrador DSED será notificado.')) return;
    await db.collection('semanas').doc(week.id).collection('divisiones').doc(div.id)
      .set({estado:'pendiente',enviadaEn:null},{merge:true});
    audNow({weekId:week.id,weekLabel:week.label,div:div.abbr,by:div.abbr},{k:'est',x:'Reabrió la carga'});
    toast('info','Carga reabierta','Estado vuelto a Pendiente');
    if(adminPh){
      const msg=`REAPERTURA - ${div.abbr} reabrió la carga. Semana: ${week?.label}. Hora: ${new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`;
      window.open(`https://wa.me/${adminPh}?text=${encodeURIComponent(msg)}`,'_blank');
    }
  };

  const doRecover = () => {
    if(!recover) return;
    savePersonal(recover.personal||[]);
    saveEventos(recover.eventosExtra||{});
    setRecover(null);
    toast('ok','Borrador restaurado','Reenviando a la nube…');
  };
  const discardRecover = () => {
    try{ if(draftKey) localStorage.removeItem(draftKey); }catch{}
    setRecover(null); setPendingSync(false);
  };

  const estado = data.estado||'pendiente';
  const personal = data.personal||[];
  const eventosExtra = data.eventosExtra||{};
  const vacios = calcVacios(personal,week);
  const totalVac = vacios.reduce((a,x)=>a+x.faltan.length,0);
  // adminPh cargado desde Firebase en el estado React
  const tabs = [
    {id:'personal',l:'👥 Mi Personal'},
    {id:'disp',l:<>📅 Disponibilidades{estado!=='enviado'&&totalVac>0&&<span style={{background:'#d97706',color:'#fff',borderRadius:'10px',padding:'1px 7px',fontSize:'10px',fontWeight:700,marginLeft:'4px'}} title="Celdas sin completar">{totalVac}</span>}</>},
    {id:'historial',l:'Historial'},
    {id:'enviar',l:estado==='enviado'?'✅ Enviado':'📤 Enviar'},
  ];

  return (
    <>
      <div className="hdr">
        <Shield s={29}/>
        <div>
          <div className="hdr-title">DISPONIBLES DPEM</div>
          <div className="hdr-sub" style={{color:div.color}}>{div.abbr} — {div.name}</div>
        </div>
        <div className="hdr-sp"/>
        {week&&<div className="hdr-week"><span className="hdr-wl">Semana:</span><span className="hdr-wv">{week.label}</span></div>}
        {week&&(()=>{
          const sent=DIVISIONS.filter(d=>globalStatus[d.id]==='enviado').length;
          const allOk=sent===4;
          return <div style={{display:'flex',alignItems:'center',gap:'5px',background:allOk?'#d1fae5':'#fff7ed',border:'1px solid '+(allOk?'#6ee7b7':'#fcd34d'),borderRadius:'6px',padding:'4px 10px'}}>
            <span style={{fontSize:'11px',color:allOk?'#065f46':'#92400e'}}>Divs:</span>
            <span style={{fontFamily:'Oswald',fontSize:'13px',color:allOk?'#065f46':'#92400e'}}>{sent}/4</span>
          </div>;
        })()}
        <span className="badge-role" style={{background:div.color}}>{div.abbr}</span>
        {saving
          ? <span style={{fontSize:'11px',color:'var(--muted)'}} title="Guardando…">💾</span>
          : pendingSync
            ? <span style={{fontSize:'11px',color:'var(--accent-l)',fontWeight:600}} title="Cambios guardados en este dispositivo, pendientes de sincronizar">⚠ Local</span>
            : <span style={{fontSize:'11px',color:'var(--ok-l)'}} title="Guardado y sincronizado">✓ Guardado</span>}
        <span className={`sb ${estado==='enviado'?'sb-ok':'sb-p'}`}>{estado==='enviado'?'✓ Enviado':'● Pendiente'}</span>
        <InstallBtn/><button className="btn-out" onClick={onLogout}>Salir</button>
      </div>
      <div className="main">
        {recover&&(
          <div style={{display:'flex',alignItems:'center',gap:'12px',flexWrap:'wrap',background:'#fff7ed',border:'1px solid #fcd34d',borderLeft:'4px solid var(--accent)',borderRadius:'8px',padding:'12px 16px',marginBottom:'16px'}}>
            <span style={{fontSize:'20px'}}>💾</span>
            <div style={{flex:1,minWidth:'220px',fontSize:'13px',color:'#92400e'}}>
              Hay cambios guardados en este dispositivo que no llegaron a sincronizarse
              {recover.savedAt?` (${new Date(recover.savedAt).toLocaleString('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})})`:''}. ¿Querés restaurarlos?
            </div>
            <button className="btn btn-ok btn-sm" onClick={doRecover}>Restaurar</button>
            <button className="btn btn-g btn-sm" onClick={discardRecover}>Descartar</button>
          </div>
        )}
        {warnVac&&(
          <div className="modal-bg" onClick={e=>e.target===e.currentTarget&&setWarnVac(false)}>
            <div className="modal-box" style={{maxWidth:'560px'}}>
              <div className="modal-t">⚠ Hay celdas sin completar<button className="modal-close" onClick={()=>setWarnVac(false)}>✕</button></div>
              <div style={{fontSize:'13px',color:'var(--muted)',marginBottom:'10px'}}>
                <strong style={{color:'var(--bad-l)'}}>{vacios.length} efectivo{vacios.length>1?'s':''}</strong> con <strong style={{color:'var(--bad-l)'}}>{totalVac} día{totalVac>1?'s':''}</strong> sin cargar. Si enviás así, el DSED los verá en blanco.
              </div>
              <div className="import-preview" style={{maxHeight:'260px'}}>
                {vacios.map(({p,faltan})=>(
                  <div key={p.id} className="import-row" style={{alignItems:'flex-start'}}>
                    <div style={{width:'170px',fontWeight:600,fontSize:'12px'}}>{p.apellido} <span style={{fontWeight:400}}>{p.nombre}</span></div>
                    <div style={{flex:1,fontSize:'11px',color:'var(--accent-l)',fontFamily:'IBM Plex Mono'}}>{faltan.map(i=>week.dias[i].label).join(' · ')}</div>
                  </div>
                ))}
              </div>
              <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
                <button className="btn btn-p" onClick={()=>{setWarnVac(false);setResaltar(true);setTab('disp');}}>✏ Completar los vacíos</button>
                <button className="btn btn-g" onClick={()=>{setWarnVac(false);submit(true);}}>Enviar igual</button>
              </div>
            </div>
          </div>
        )}
        <div className="tabs">{tabs.map(t=><button key={t.id} className={`tab${tab===t.id?' on':''}`} onClick={()=>setTab(t.id)}>{t.l}</button>)}</div>

        {/* ─ MI PERSONAL ─ */}
        {tab==='personal'&&<PersonnelEd personal={personal} onChange={savePersonal}/>}

        {/* ─ DISPONIBILIDADES ─ */}
        {tab==='disp'&&(
          <div>
            <Recordatorios/>
            <EventosExtra week={week} eventosExtra={eventosExtra} onChange={saveEventos} readOnly={estado==='enviado'}/>
            <AvailGrid week={week} personal={personal} onChange={savePersonal} readOnly={estado==='enviado'} div={div} resaltarVacios={resaltar&&totalVac>0}/>
            {estado!=='enviado'&&personal.length>0&&(
              <div style={{marginTop:'20px',display:'flex',gap:'10px',alignItems:'center',flexWrap:'wrap'}}>
                <button className="btn btn-ok btn-lg" onClick={submit} disabled={saving}>{saving?'⏳ Enviando...':'📤 Enviar y avisar por WhatsApp'}</button>
                {adminPh
                  ? <span style={{fontSize:'12px',color:'var(--muted)'}}>📲 Al enviar se abre WhatsApp para avisar al DSED (obligatorio).</span>
                  : <span style={{fontSize:'12px',color:'var(--bad-l)',fontWeight:600}}>⚠ Falta el WhatsApp del DSED — no se puede enviar hasta que el administrador lo configure.</span>}
              </div>
            )}
            {estado==='enviado'&&<div style={{marginTop:'12px'}}><button className="btn btn-g" onClick={reopen}>🔓 Reabrir para editar</button></div>}
          </div>
        )}

        {/* HISTORIAL */}
        {tab==='historial'&&<HistorialDiv div={div}/>}

        {/* ─ ENVIAR ─ */}
        {tab==='enviar'&&(
          <div>
            <div className="sec-t">Estado del Envío</div>
            {estado==='enviado'?(
              <div className="card" style={{textAlign:'center',padding:'30px'}}>
                <div style={{fontSize:'50px',marginBottom:'10px'}}>✅</div>
                <div style={{fontFamily:'Oswald',fontSize:'20px',color:'var(--ok-l)',marginBottom:'5px'}}>Carga enviada correctamente</div>
                <div style={{fontSize:'13px',color:'var(--muted)',marginBottom:'18px'}}>
                  {data.enviadaEn?`Enviado el ${fmtDT(data.enviadaEn)}`:''}<br/>
                  {personal.length} efectivos · {week?.label}
                </div>
                <div style={{display:'flex',gap:'9px',justifyContent:'center',flexWrap:'wrap'}}>
                  {adminPh&&(
                    <a href={`https://wa.me/${adminPh}?text=${encodeURIComponent(`✅ *${div.abbr} — ${div.name}*\nDisponibilidades _ENVIADAS_ ✅\nSemana: ${week?.label}\nEfectivos: ${personal.length}\nEnviado: ${fmtDT(data.enviadaEn)}`)}`}
                      target="_blank" rel="noopener noreferrer" className="btn btn-ok" style={{textDecoration:'none'}}>
                      📱 Notificar al DSED por WhatsApp
                    </a>
                  )}
                  <button className="btn btn-g" onClick={reopen}>🔓 Reabrir para editar</button>
                </div>
              </div>
            ):(
              <div>
                {!week&&<div className="alert-warn">No hay semana activa. El administrador DSED debe configurar la semana.</div>}
                {week&&(
                  <div className="card">
                    <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'10px',marginBottom:'18px'}}>
                      {[{l:'Semana',v:week.label,sm:true},{l:'Efectivos cargados',v:`${personal.length}`},{l:'Días configurados',v:`${(week.dias||[]).filter(d=>d.label).length} días`},{l:'Estado',v:'Pendiente de envío'}].map(x=>(
                        <div key={x.l} className="tile"><div className="tile-l">{x.l}</div><div className="tile-v" style={{fontSize:x.sm?'14px':'20px'}}>{x.v}</div></div>
                      ))}
                    </div>
                    <div style={{marginBottom:'12px'}}>
                      <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'6px',textTransform:'uppercase',letterSpacing:'.5px',fontWeight:600}}>Estado de divisiones</div>
                      <div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                        {DIVISIONS.map(d=>{
                          const sent=globalStatus[d.id]==='enviado';
                          const bg=sent?'#d1fae5':'#fff7ed';
                          const col=sent?'#065f46':'#92400e';
                          const bdr=sent?'1px solid #6ee7b7':'1px solid #fcd34d';
                          return <span key={d.id} style={{display:'inline-flex',alignItems:'center',gap:'4px',padding:'3px 9px',borderRadius:'10px',fontSize:'11px',fontWeight:600,background:bg,color:col,border:bdr}}>
                            {sent?'+ ':'. '}{d.abbr}
                          </span>;
                        })}
                      </div>
                    </div>
                    {personal.length===0
                      ? <div className="alert-warn" style={{marginBottom:'14px'}}>⚠ Primero cargá los efectivos en "Mi Personal".</div>
                      : (<>
                          <Recordatorios defaultOpen={false}/>
                          {!adminPh&&<div className="alert-warn" style={{marginBottom:'12px'}}>⚠ Falta el número de WhatsApp del DSED. No se puede enviar hasta que el administrador lo configure.</div>}
                          <button className="btn btn-ok btn-lg" onClick={submit} disabled={saving||!adminPh}>{saving?'⏳ Enviando...':'📤 Confirmar, enviar y avisar por WhatsApp'}</button>
                        </>)
                    }
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    </>
  );
};

// ══════════════════════════════════════════════════════════
//  ROOT
// ══════════════════════════════════════════════════════════
const App = () => {
  const [sess,setSess] = useState(null);
  return (
    <>
      <ToastC/>
      {!sess&&<Login onLogin={setSess}/>}
      {sess?.role==='admin'&&<AdminApp onLogout={()=>setSess(null)}/>}
      {sess?.role==='div'&&<DivisionApp div={sess.div} onLogout={()=>setSess(null)}/>}
      {sess?.role==='carpetas'&&<CarpetasApp onLogout={()=>setSess(null)}/>}
    </>
  );
};
ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>

      {/* Grilla editable */}
      {personal.length === 0
        ? <div className="alert-warn">
            Esta División no tiene personal cargado. Importá la nómina desde la pestaña <strong>👥 Nómina</strong>.
          </div>
        : <AvailGrid
            week={week}
            personal={personal}
            onChange={handleChange}
            readOnly={false}
            div={div}
          />
      }
    </div>
  );
};

// ══════════════════════════════════════════════════════════
//  ADMIN CARPETAS — subir Excel para perfil PARA CARPETAS
// ══════════════════════════════════════════════════════════
const AdminCarpetas = () => {
  const [current, setCurrent] = useState(null); // {fileName, uploadedAt, size}
  const [uploading, setUploading] = useState(false);
  const [dragging, setDragging] = useState(false);
  const fileRef = useRef();

  useEffect(()=>{
    const unsub = db.collection('config').doc('carpetas_excel')
      .onSnapshot(snap=>{
        if(snap.exists){
          const d = snap.data();
          setCurrent({fileName:d.fileName, uploadedAt:d.uploadedAt, size:d.size, weekLabel:d.weekLabel||''});
        } else {
          setCurrent(null);
        }
      });
    return ()=>unsub();
  },[]);

  const uploadFile = async (file) => {
    if(!file) return;
    const allowed = ['.xlsx','.xls','.ods','.csv'];
    const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
    if(!allowed.includes(ext)){ toast('bad','Formato no válido','Solo se admiten archivos .xlsx, .xls, .ods o .csv'); return; }
    // Check size: Firestore doc limit ~1MB; base64 increases ~33%, so warn above 700KB
    if(file.size > 700000){ toast('bad','Archivo muy grande',`El archivo pesa ${(file.size/1024).toFixed(0)} KB. Máximo recomendado: 700 KB para almacenamiento en Firestore.`); return; }
    setUploading(true);
    try{
      const buf = await file.arrayBuffer();
      const bytes = new Uint8Array(buf);
      let binary = '';
      bytes.forEach(b=>binary+=String.fromCharCode(b));
      const b64 = btoa(binary);
      await db.collection('config').doc('carpetas_excel').set({
        fileName: file.name,
        data: b64,
        size: file.size,
        weekLabel: '',
        uploadedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
      toast('ok','Archivo subido',`${file.name} disponible para "Para Carpetas"`);
    }catch(e){ toast('bad','Error al subir',e.message); }
    setUploading(false);
  };

  const handleDrop = e => {
    e.preventDefault(); setDragging(false);
    const f = e.dataTransfer.files[0];
    if(f) uploadFile(f);
  };

  const remove = async () => {
    if(!window.confirm('¿Eliminar el archivo adjunto? El perfil "Para Carpetas" no podrá ver nada hasta que subas uno nuevo.')) return;
    await db.collection('config').doc('carpetas_excel').delete();
    toast('info','Archivo eliminado','');
  };

  const fmtSize = b => b > 1024*1024 ? `${(b/1024/1024).toFixed(1)} MB` : `${(b/1024).toFixed(0)} KB`;

  return (
    <div>
      <div className="sec-t">Archivo para Carpetas</div>
      <div style={{fontSize:'12px',color:'var(--muted)',background:'rgba(217,119,6,.07)',border:'1px solid rgba(217,119,6,.25)',borderRadius:'6px',padding:'9px 13px',marginBottom:'18px'}}>
        📂 El archivo que subas aquí será visible <strong style={{color:'var(--accent-l)'}}>exclusivamente</strong> para quien ingrese con el perfil <strong style={{color:'var(--accent-l)'}}>PARA CARPETAS</strong> (contraseña: <code style={{background:'var(--card)',padding:'1px 5px',borderRadius:'3px'}}>carpetitas</code>). Reemplazá el archivo cuando necesites actualizar la versión.
      </div>

      {current && (
        <div className="card" style={{borderLeft:'4px solid var(--accent)',marginBottom:'18px'}}>
          <div className="card-t">📄 Archivo actual</div>
          <div style={{display:'flex',gap:'16px',alignItems:'center',flexWrap:'wrap'}}>
            <div style={{flex:1}}>
              <div style={{fontFamily:'Oswald',fontSize:'16px',color:'var(--text)',marginBottom:'3px'}}>{current.fileName}</div>
              <div style={{fontSize:'11px',color:'var(--muted)',fontFamily:'IBM Plex Mono'}}>
                {current.size ? fmtSize(current.size) : ''}
                {current.uploadedAt ? ` · Subido: ${fmtDT(current.uploadedAt)}` : ''}
              </div>
            </div>
            <button className="btn btn-bad btn-sm" onClick={remove}>🗑 Eliminar</button>
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-t">{current ? '📥 Reemplazar archivo' : '📥 Subir archivo'}</div>
        <div
          className={`import-drop${dragging?' drag':''}`}
          onDragOver={e=>{e.preventDefault();setDragging(true)}}
          onDragLeave={()=>setDragging(false)}
          onDrop={handleDrop}
          onClick={()=>!uploading&&fileRef.current.click()}
          style={{cursor:uploading?'not-allowed':'pointer',opacity:uploading?.6:1}}
        >
          <div style={{fontSize:'32px',marginBottom:'8px'}}>{uploading?'⏳':'📂'}</div>
          <div style={{fontFamily:'Oswald',fontSize:'16px',color:'var(--accent-l)'}}>
            {uploading?'Subiendo archivo...':'Arrastrá tu Excel o hacé clic aquí'}
          </div>
          <div style={{fontSize:'12px',color:'var(--muted)',marginTop:'4px'}}>Formatos: .xlsx · .xls · .ods · .csv — Máx. 700 KB</div>
        </div>
        <input ref={fileRef} type="file" accept=".xlsx,.xls,.ods,.csv" style={{display:'none'}} onChange={e=>uploadFile(e.target.files[0])}/>
      </div>
    </div>
  );
};

const CarpetasApp = ({onLogout}) => {

  const [week,    setWeek]    = useState(null);
  const [subs,    setSubs]    = useState({});

  // ── Archivo adjunto ──────────────────────────────────────
  useEffect(()=>{
    return db.collection('config').doc('carpetas_excel')
      .onSnapshot(snap=>{
        setFileData(snap.exists && snap.data().data ? snap.data() : false);
      }, ()=>setFileData(false));
  },[]);

  // ── Semana activa ────────────────────────────────────────
  useEffect(()=>
    db.collection('semanas').where('activa','==',true).onSnapshot(s=>{
      if(s.empty){ setWeek(null); return; }
      const d=s.docs[0]; setWeek({id:d.id,...d.data()});
    })
  ,[]);

  // ── Datos de divisiones (readonly) ───────────────────────
  useEffect(()=>{
    if(!week){ setSubs({}); return; }
    const uns = DIVISIONS.map(div=>
      db.collection('semanas').doc(week.id).collection('divisiones').doc(div.id)
        .onSnapshot(snap=>{
          const data = snap.exists ? snap.data() : {estado:'pendiente',personal:[],eventosExtra:{}};
          setSubs(p=>({...p,[div.id]:data}));
        })
    );
    return ()=>uns.forEach(u=>u());
  },[week?.id]);

  const download = () => {
    if(!fileData) return;
    try{
      const binary = atob(fileData.data);
      const bytes = new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
      const blob = new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = fileData.fileName || 'DISPONIBLES_DPEM.xlsx';
      a.click();
      toast('ok','Descargando...',fileData.fileName);
    }catch(e){ toast('bad','Error al descargar',e.message); }
  };

  const fmtSize = b => b > 1024*1024 ? `${(b/1024/1024).toFixed(1)} MB` : `${(b/1024).toFixed(0)} KB`;

  const tabs = [
    {id:'archivo',  l:'📥 Archivo'},
    {id:'unificado',l:'📋 Vista Unificada'},
  ];

  return (
    <>
      <div className="hdr">
        <Shield s={29}/>
        <div>
          <div className="hdr-title">DISPONIBLES DPEM</div>
          <div className="hdr-sub">Para Carpetas</div>
        </div>
        <div className="hdr-sp"/>
        {week && <div className="hdr-week"><span className="hdr-wl">Semana:</span><span className="hdr-wv">{week.label}</span></div>}
        <span className="badge-role" style={{background:'var(--accent)'}}>CARPETAS</span>
        <InstallBtn/><button className="btn-out" onClick={onLogout}>Salir</button>
      </div>

      <div className="main">
        {/* Tabs */}
        <div className="tabs">
          {tabs.map(t=>(
            <button key={t.id} className={`tab${tab===t.id?' on':''}`} onClick={()=>setTab(t.id)}>
              {t.l}
            </button>
          ))}
          {/* Botón de descarga rápida siempre visible en header de tabs */}
          {fileData && (
            <button className="btn btn-ok btn-sm" onClick={download}
              style={{marginLeft:'auto',alignSelf:'center',marginBottom:'1px'}}>
              ⬇ Descargar Excel
            </button>
          )}
        </div>

        {/* ── TAB ARCHIVO ── */}
        {tab==='archivo' && (
          <div>
            <div className="sec-t">Archivo adjunto</div>
            {fileData === null && (
              <div style={{textAlign:'center',padding:'60px',color:'var(--muted)'}}>
                <div style={{fontSize:'32px',marginBottom:'12px'}}>⏳</div>
                <div>Buscando archivo...</div>
              </div>
            )}
            {fileData === false && (
              <div className="alert-warn" style={{textAlign:'center',padding:'40px'}}>
                <div style={{fontSize:'40px',marginBottom:'12px'}}>📭</div>
                <div style={{fontFamily:'Oswald',fontSize:'18px',color:'var(--accent-l)',marginBottom:'8px'}}>Sin archivo adjunto</div>
                <div style={{fontSize:'13px',color:'var(--muted)'}}>El administrador todavía no subió ningún archivo. Volvé a revisar más tarde.</div>
              </div>
            )}
            {fileData && (
              <div className="card" style={{borderLeft:'4px solid var(--ok)',padding:'32px',maxWidth:'600px',margin:'0 auto'}}>
                <div style={{textAlign:'center',marginBottom:'26px'}}>
                  <div style={{fontSize:'60px',marginBottom:'12px'}}>📊</div>
                  <div style={{fontFamily:'Oswald',fontSize:'24px',color:'var(--text)',marginBottom:'6px'}}>{fileData.fileName}</div>
                  <div style={{fontSize:'12px',color:'var(--muted)',fontFamily:'IBM Plex Mono'}}>
                    {fileData.size ? fmtSize(fileData.size) : ''}
                    {fileData.uploadedAt ? ` · Subido: ${fmtDT(fileData.uploadedAt)}` : ''}
                  </div>
                </div>
                <div style={{display:'flex',justifyContent:'center'}}>
                  <button className="btn btn-ok btn-lg" onClick={download}
                    style={{padding:'14px 40px',fontSize:'16px',gap:'10px'}}>
                    ⬇ Descargar archivo
                  </button>
                </div>
              </div>
            )}
          </div>
        )}

        {/* ── TAB VISTA UNIFICADA ── */}
        {tab==='unificado' && (
          <UnifiedView week={week} subs={subs}/>
        )}
      </div>
    </>
  );
};

//  ADMIN APP

// ══════════════════════════════════════════════════════════
//  ESTADÍSTICAS DE EQUIDAD
// ══════════════════════════════════════════════════════════
const EquidadPanel = () => {
  const [n,setN]=useState(8);
  const [rows,setRows]=useState(null);
  const [loading,setLoading]=useState(false);
  const [fdiv,setFdiv]=useState('all');
  const [orden,setOrden]=useState('pct');
  const [nSem,setNSem]=useState(0);

  const cargar=async()=>{
    setLoading(true);
    try{
      let q=db.collection('semanas').orderBy('creadaEn','desc'); if(n>0) q=q.limit(n);
      const ws=await q.get();
      const map=new Map(); let usadas=0;
      for(const wd of ws.docs){
        const week={id:wd.id,...wd.data()};
        const snaps=await Promise.all(DIVISIONS.map(d=>db.collection('semanas').doc(wd.id).collection('divisiones').doc(d.id).get()));
        const infos=(week.dias||[]).map(d=>diaInfo(week,d.label));
        let alguna=false;
        snaps.forEach((s,i)=>{
          if(!s.exists) return;
          (s.data().personal||[]).forEach(p=>{
            const key=`${DIVISIONS[i].id}|${p.apellido}|${p.nombre}`;
            let r=map.get(key);
            if(!r){r={key,div:DIVISIONS[i],jer:p.jerarquia,ap:p.apellido,nom:p.nombre,sem:0,disp:0,vol:0,afect:0,afFds:0,no:0,vacio:0};map.set(key,r);}
            r.sem++; r.jer=p.jerarquia;
            (week.dias||[]).forEach((d,di)=>{
              if(!d.label) return;
              const k=clasifAv((p.disponibilidad||{})[String(di)]); alguna=true;
              if(k==='disp') r.disp++; else if(k==='vol') r.vol++; else if(k==='no') r.no++; else if(k==='vacio') r.vacio++;
              else { r.afect++; if(infos[di].weekend||infos[di].feriado) r.afFds++; }
            });
          });
        });
        if(alguna) usadas++;
      }
      setNSem(usadas);
      setRows([...map.values()].map(r=>{const base=r.disp+r.vol+r.afect;return {...r,base,pct:base?r.afect/base:0};}));
    }catch(e){ toast('bad','Error al calcular',e.message); }
    setLoading(false);
  };
  useEffect(()=>{cargar();},[n]);

  const filt=(rows||[]).filter(r=>fdiv==='all'||r.div.id===fdiv);
  const conBase=filt.filter(r=>r.base>0);
  const mean=conBase.length?conBase.reduce((a,r)=>a+r.pct,0)/conBase.length:0;
  const sd=conBase.length?Math.sqrt(conBase.reduce((a,r)=>a+(r.pct-mean)**2,0)/conBase.length):0;
  const sorted=[...filt].sort((a,b)=>orden==='pct'?(b.pct-a.pct||b.afect-a.afect):orden==='fds'?(b.afFds-a.afFds||b.pct-a.pct):orden==='afect'?(b.afect-a.afect):(a.ap+a.nom).localeCompare(b.ap+b.nom));
  const maxP=Math.max(0.01,...sorted.map(r=>r.pct));

  const exportar=async()=>{
    try{
      const wb=new ExcelJS.Workbook(); const ws=wb.addWorksheet('Equidad');
      ws.addRow(['División','Jerarquía','Apellido','Nombre','Semanas','Disponible','Voluntario','Afectado/otro','Afect. FdS/feriado','No disp.','Sin cargar','% afectación']);
      ws.getRow(1).font={bold:true};
      sorted.forEach(r=>ws.addRow([r.div.abbr,r.jer,r.ap,r.nom,r.sem,r.disp,r.vol,r.afect,r.afFds,r.no,r.vacio,Math.round(r.pct*1000)/10]));
      [8,14,18,18,9,11,11,13,16,9,10,12].forEach((w,i)=>{ws.getColumn(i+1).width=w;});
      ws.views=[{state:'frozen',ySplit:1}];
      const buf=await wb.xlsx.writeBuffer();
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
      a.download='EQUIDAD_DPEM.xlsx'; a.click();
    }catch(e){ toast('bad','Error al exportar',e.message); }
  };
  const selSt={background:'#fff',border:'1.5px solid var(--border)',borderRadius:'6px',padding:'6px 8px',fontSize:'13px',color:'var(--text)'};
  const th={textAlign:'left',padding:'6px 8px',fontSize:'11px',color:'var(--muted)',borderBottom:'2px solid var(--border)',whiteSpace:'nowrap'};
  const td={padding:'5px 8px',fontSize:'12px',borderBottom:'1px solid var(--border)',whiteSpace:'nowrap'};
  return (
    <div>
      <div className="sec-t">Estadísticas de equidad</div>
      <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px'}}>
        Cuántas veces fue afectado cada efectivo (servicios, permanencias, A/C, etc.) respecto de las veces que quedó disponible o voluntario. Sirve para repartir la carga de forma pareja.
      </div>
      <div style={{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center',marginBottom:'14px'}}>
        <select style={selSt} value={n} onChange={e=>setN(+e.target.value)}>
          <option value={4}>Últimas 4 semanas</option><option value={8}>Últimas 8 semanas</option><option value={12}>Últimas 12 semanas</option><option value={0}>Todo el historial</option>
        </select>
        <select style={selSt} value={fdiv} onChange={e=>setFdiv(e.target.value)}>
          <option value="all">Todas las divisiones</option>{DIVISIONS.map(d=><option key={d.id} value={d.id}>{d.abbr}</option>)}
        </select>
        <select style={selSt} value={orden} onChange={e=>setOrden(e.target.value)}>
          <option value="pct">Orden: % afectación</option><option value="afect">Orden: cantidad afectado</option><option value="fds">Orden: fines de semana / feriados</option><option value="ap">Orden: apellido</option>
        </select>
        <button className="btn btn-g btn-sm" onClick={cargar} disabled={loading}>{loading?'⏳ Calculando…':'↻ Actualizar'}</button>
        <button className="btn btn-g btn-sm" onClick={exportar} disabled={!sorted.length}>⬇ Excel</button>
        {rows&&<span style={{fontSize:'11px',color:'var(--dim)'}}>{nSem} semana{nSem!==1?'s':''} con datos · promedio de afectación {Math.round(mean*100)}%</span>}
      </div>
      {loading&&!rows&&<div style={{color:'var(--muted)',padding:'20px',textAlign:'center'}}>Calculando…</div>}
      {rows&&(
        <div className="card" style={{padding:0,overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr>
              <th style={th}>Efectivo</th><th style={th}>Div.</th><th style={th} title="Semanas en las que figura">Sem.</th>
              <th style={th}>✓ Disp.</th><th style={th}>V</th><th style={th} title="Afectado / otro">◆ Afect.</th><th style={th} title="Afectado en fin de semana o feriado">◆ FdS/fer.</th><th style={th}>✕ No</th><th style={th}>○ Vacío</th><th style={{...th,minWidth:'150px'}}>% afectación</th>
            </tr></thead>
            <tbody>
              {sorted.map(r=>{
                const alto=r.base>0&&r.afect>=2&&r.pct>mean+sd;
                return (
                  <tr key={r.key} style={{background:alto?'#fff7ed':undefined}}>
                    <td style={td}><b>{r.ap}</b> {r.nom} <span style={{color:'var(--dim)',fontSize:'10px'}}>{r.jer}</span></td>
                    <td style={{...td,color:r.div.color,fontWeight:700}}>{r.div.abbr}</td>
                    <td style={td}>{r.sem}</td><td style={td}>{r.disp}</td><td style={td}>{r.vol}</td>
                    <td style={{...td,fontWeight:700,color:'#1d4ed8'}}>{r.afect}</td>
                    <td style={{...td,color:r.afFds?'#b45309':'var(--dim)',fontWeight:r.afFds?700:400}}>{r.afFds}</td>
                    <td style={td}>{r.no}</td><td style={td}>{r.vacio}</td>
                    <td style={td}>
                      <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                        <div style={{flex:1,height:'8px',background:'#e5e7eb',borderRadius:'4px',minWidth:'80px'}}>
                          <div style={{width:`${(r.pct/maxP)*100}%`,height:'100%',borderRadius:'4px',background:alto?'#d97706':'#3b82f6'}}/>
                        </div>
                        <span style={{fontFamily:'IBM Plex Mono,monospace',fontSize:'11px',width:'34px',textAlign:'right'}}>{Math.round(r.pct*100)}%</span>
                      </div>
                    </td>
                  </tr>
                );
              })}
              {!sorted.length&&<tr><td style={{...td,textAlign:'center',color:'var(--muted)'}} colSpan={10}>Sin datos para mostrar.</td></tr>}
            </tbody>
          </table>
        </div>
      )}
      <div style={{fontSize:'10.5px',color:'var(--dim)',marginTop:'8px'}}>Resaltado en naranja: efectivos con más afectación que el promedio + 1 desvío (mínimo 2 afectaciones). Las celdas vacías no cuentan para el porcentaje.</div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════
//  REGISTRO DE CAMBIOS

const RegistroPanel = () => {
  const [docs,setDocs]=useState(null);
  const [loading,setLoading]=useState(false);
  const [fdiv,setFdiv]=useState('all');
  const [txt,setTxt]=useState('');
  const cargar=async()=>{
    setLoading(true);
    try{
      const s=await db.collection('cambios').orderBy('ts','desc').limit(200).get();
      setDocs(s.docs.map(d=>({id:d.id,...d.data()})));
    }catch(e){ toast('bad','Error al leer el registro',e.message); }
    setLoading(false);
  };
  useEffect(()=>{cargar();},[]);
  const q=_norm(txt.trim());
  const lista=(docs||[]).filter(d=>(fdiv==='all'||d.div===fdiv)&&(!q||_norm(`${d.weekLabel} ${d.by} ${(d.items||[]).map(i=>`${i.p} ${i.d} ${i.a} ${i.b} ${i.x}`).join(' ')}`).includes(q)));
  const linea=i=>{
    const v=s=>s?s:'(vacío)';
    if(i.k==='c') return <><b>{i.p}</b> · {i.d}: <span style={{color:'#dc2626'}}>{v(i.a)}</span> → <span style={{color:'#059669'}}>{v(i.b)}</span></>;
    if(i.k==='alta') return <>➕ Alta: <b>{i.p}</b></>;
    if(i.k==='baja') return <>➖ Baja: <b>{i.p}</b></>;
    if(i.k==='ed') return <>✏ {i.a} → {i.b}</>;
    if(i.k==='ev') return <>📌 {i.d}: <span style={{color:'#dc2626'}}>{v(i.a)}</span> → <span style={{color:'#059669'}}>{v(i.b)}</span></>;
    return <>{i.x}</>;
  };
  let lastDay='';
  const selSt={background:'#fff',border:'1.5px solid var(--border)',borderRadius:'6px',padding:'6px 8px',fontSize:'13px',color:'var(--text)'};
  return (
    <div>
      <div className="sec-t">Registro de cambios</div>
      <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px'}}>Quién cambió qué y cuándo (últimos 200 registros). Las ediciones seguidas se agrupan en un solo registro.</div>
      <div style={{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center',marginBottom:'14px'}}>
        <select style={selSt} value={fdiv} onChange={e=>setFdiv(e.target.value)}>
          <option value="all">Todas las divisiones</option>{DIVISIONS.map(d=><option key={d.id} value={d.abbr}>{d.abbr}</option>)}<option value="DSED">DSED / Admin</option>
        </select>
        <input value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Buscar persona, semana, estado…" style={{...selSt,width:'260px'}}/>
        <button className="btn btn-g btn-sm" onClick={cargar} disabled={loading}>{loading?'⏳':'↻ Actualizar'}</button>
        {docs&&<span style={{fontSize:'11px',color:'var(--dim)'}}>{lista.length} registro{lista.length!==1?'s':''}</span>}
      </div>
      {docs&&!lista.length&&<div className="alert-warn">No hay registros para mostrar.</div>}
      {lista.map(d=>{
        const dt=d.ts?.toDate?d.ts.toDate():null;
        const day=dt?dt.toLocaleDateString('es-AR',{weekday:'long',day:'2-digit',month:'long'}):'';
        const head=day!==lastDay?(lastDay=day,<div style={{fontFamily:'Oswald,sans-serif',fontSize:'13px',color:'var(--primary)',margin:'14px 0 6px',textTransform:'capitalize'}}>{day}</div>):null;
        return (
          <React.Fragment key={d.id}>
            {head}
            <div className="card" style={{padding:'8px 12px',marginBottom:'6px'}}>
              <div style={{fontSize:'11px',color:'var(--muted)',marginBottom:'4px'}}>
                <b style={{color:'var(--text)'}}>{dt?dt.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'—'}</b> · {d.by||d.div||'—'}{d.div&&d.by&&d.div!==d.by?` (${d.div})`:''}{d.weekLabel?` · ${d.weekLabel}`:''} · {d.n||(d.items||[]).length} cambio{(d.n||(d.items||[]).length)!==1?'s':''}
              </div>
              <div style={{fontSize:'12px',fontFamily:'IBM Plex Mono,monospace',lineHeight:1.55}}>
                {(d.items||[]).slice(0,40).map((i,ix)=><div key={ix}>{linea(i)}</div>)}
                {(d.items||[]).length>40&&<div style={{color:'var(--dim)'}}>… y {(d.items||[]).length-40} más</div>}
              </div>
            </div>
          </React.Fragment>
        );
      })}
    </div>
  );
};

const RespaldoPanel = () => {
  const [list,setList]=useState(null);
  const [busy,setBusy]=useState('');
  const cargar=async()=>{
    try{
      const s=await db.collection('respaldos').orderBy('ts','desc').limit(20).get();
      setList(s.docs.map(d=>({id:d.id,...d.data()})));
    }catch(e){ toast('bad','Error al leer respaldos',e.message); setList([]); }
  };
  useEffect(()=>{cargar();},[]);
  const crear=async()=>{
    setBusy('crear');
    try{ const id=await hacerRespaldo('manual'); if(id){toast('ok','Respaldo creado','');cargar();} else toast('bad','No hay semana activa','Activá una semana para respaldarla.'); }
    catch(e){ toast('bad','Error al respaldar',e.message); }
    setBusy('');
  };
  const bajarUno=async(id)=>{
    setBusy(id);
    try{ const s=await db.collection('respaldos').doc(id).collection('data').doc('p').get(); bajarArchivo(`DISPONIBLES_respaldo_${id.slice(0,16)}.json`,s.data().json); }
    catch(e){ toast('bad','Error',e.message); }
    setBusy('');
  };
  const restaurar=async(r)=>{
    if(!window.confirm(`¿Restaurar el respaldo del ${r.ts?.toDate?r.ts.toDate().toLocaleString('es-AR'):''}?\n\nSemana: ${r.weekLabel}\n\nSe reemplazan la semana, las 4 divisiones y las nóminas por lo guardado en el respaldo. Antes se crea un respaldo del estado actual.`)) return;
    setBusy(r.id);
    try{ const lab=await restaurarRespaldo(r.id); toast('ok','Respaldo restaurado',lab); cargar(); }
    catch(e){ toast('bad','Error al restaurar',e.message); }
    setBusy('');
  };
  const bajarTodo=async()=>{
    setBusy('todo');
    try{
      const out={version:1,exportado:new Date().toISOString(),semanas:[],nominas:await snapNominas()};
      const ws=await db.collection('semanas').get();
      for(const w of ws.docs) out.semanas.push(await snapSemana(w.id));
      bajarArchivo(`DISPONIBLES_completo_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(out));
      toast('ok','Descarga lista',`${out.semanas.length} semanas`);
    }catch(e){ toast('bad','Error',e.message); }
    setBusy('');
  };
  return (
    <div>
      <div className="sec-t">Respaldo</div>
      <div style={{fontSize:'12px',color:'var(--muted)',marginBottom:'12px'}}>
        Se guarda un respaldo automático de la semana activa (con sus 4 divisiones y las nóminas) una vez por día al abrir el panel de administración. Se conservan los 30 más recientes.
      </div>
      <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'16px'}}>
        <button className="btn btn-ok" onClick={crear} disabled={!!busy}>{busy==='crear'?'⏳ Respaldando…':'🛟 Crear respaldo ahora'}</button>
        <button className="btn btn-g" onClick={bajarTodo} disabled={!!busy}>{busy==='todo'?'⏳ Preparando…':'⬇ Descargar TODO (JSON)'}</button>
      </div>
      {list===null&&<div style={{color:'var(--muted)'}}>Cargando…</div>}
      {list&&!list.length&&<div className="alert-warn">Todavía no hay respaldos.</div>}
      {list&&list.map(r=>(
        <div key={r.id} className="card" style={{padding:'9px 14px',marginBottom:'6px',display:'flex',alignItems:'center',gap:'10px',flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:'200px'}}>
            <div style={{fontSize:'13px',fontWeight:600}}>{r.ts?.toDate?r.ts.toDate().toLocaleString('es-AR'):'—'} <span style={{fontSize:'10px',fontWeight:600,color:'#fff',background:r.motivo==='auto'?'#64748b':'#2563eb',borderRadius:'8px',padding:'1px 7px',marginLeft:'4px'}}>{r.motivo}</span></div>
            <div style={{fontSize:'11px',color:'var(--muted)'}}>{r.weekLabel} · {r.efectivos} efectivos · {Math.round((r.bytes||0)/1024)} KB</div>
          </div>
          <button className="btn btn-g btn-sm" onClick={()=>bajarUno(r.id)} disabled={!!busy}>⬇ JSON</button>
          <button className="btn btn-g btn-sm" onClick={()=>restaurar(r)} disabled={!!busy} style={{color:'var(--bad)'}}>↺ Restaurar</button>
        </div>
      ))}
    </div>
  );
};

const AdminApp = ({onLogout}) => {
  const [tab,setTab] = useState('estado');
  const [week,setWeek] = useState(null);
  const [subs,setSubs] = useState({});
  const [phone,setPhone] = useState(()=>localStorage.getItem('dpem_ph')||'');
  const prev = useRef({});
  const phoneTimer = useRef(null);

  useEffect(()=>{
    db.collection('config').doc('global').get().then(snap=>{
      if(snap.exists && snap.data().phone){ setPhone(snap.data().phone); localStorage.setItem('dpem_ph',snap.data().phone); }
    }).catch(()=>{});
  },[]);

  useEffect(()=>db.collection('semanas').where('activa','==',true).onSnapshot(s=>{
    if(s.empty){setWeek(null);return;} const d=s.docs[0]; setWeek({id:d.id,...d.data()});
  }),[]);

  useEffect(()=>{
    if(!week){setSubs({});return;}
    const uns = DIVISIONS.map(div=>
      db.collection('semanas').doc(week.id).collection('divisiones').doc(div.id).onSnapshot(snap=>{
        const data = snap.exists?snap.data():{estado:'pendiente',personal:[],eventosExtra:{}};
        if(prev.current[div.id]?.estado!=='enviado'&&data.estado==='enviado'){
          toast('ok',`${div.abbr} completó su carga`,div.name);
          try{ const ctx=new AudioContext(),osc=ctx.createOscillator(),g=ctx.createGain(); osc.connect(g);g.connect(ctx.destination); osc.frequency.value=880;g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.4); osc.start();osc.stop(ctx.currentTime+.4); }catch{}
        }
        prev.current[div.id]=data;
        setSubs(p=>({...p,[div.id]:data}));
      })
    );
    return()=>uns.forEach(u=>u());
  },[week?.id]);

  useEffect(()=>{
    localStorage.setItem('dpem_ph',phone);
    if(phoneTimer.current) clearTimeout(phoneTimer.current);
    phoneTimer.current=setTimeout(()=>{ if(phone) db.collection('config').doc('global').set({phone},{merge:true}).catch(()=>{}); },1000);
  },[phone]);

  // Respaldo automático diario (al abrir el panel con una semana activa)
  const autoBk = useRef(false);
  useEffect(()=>{
    if(!week||autoBk.current) return; autoBk.current=true;
    (async()=>{
      try{
        const c=await db.collection('config').doc('backup').get();
        const last=c.exists?(c.data().lastAt||0):0;
        if(Date.now()-last<20*3600*1000) return;
        await hacerRespaldo('auto');
      }catch{}
    })();
  },[week?.id]);

  const pend = DIVISIONS.filter(d=>subs[d.id]?.estado!=='enviado').length;

  // Detectar modificaciones post-envío (mismo criterio que StatusPanel)
  const wasModifiedAfterSend = (s) => {
    if(!s || s.estado!=='enviado') return false;
    const mod  = s.lastModifiedAt?.toMillis?.();
    const sent = s.enviadaEn?.toMillis?.();
    if(!mod || !sent) return false;
    return mod > sent + 5000;
  };
  const modPostEnvio = DIVISIONS.filter(d => wasModifiedAfterSend(subs[d.id]));

  const tabs = [
    {id:'semanas',  l:'📅 Semanas / Fixture'},
    {id:'nomina',   l:'👥 Nómina'},
    {id:'estado',   l:'📊 Estado'},
    {id:'editar',   l:'✏ Editar Disponibilidad'},
    {id:'unificado',l:'📋 Vista Unificada'},
    {id:'exportar', l:'⬇ Exportar'},
    {id:'carpetas', l:'📂 Para Carpetas'},
    {id:'equidad',  l:'📈 Equidad'},
    {id:'registro', l:'🧾 Registro'},
    {id:'respaldo', l:'🛟 Respaldo'},
  ];
  return (
    <>
      <div className="hdr">
        <Shield s={29}/>
        <div><div className="hdr-title">DISPONIBLES DPEM</div><div className="hdr-sub">DSED · Administrador</div></div>
        <div className="hdr-sp"/>
        {week&&<div className="hdr-week"><span className="hdr-wl">Semana activa:</span><span className="hdr-wv">{week.label}</span></div>}
        <span className="badge-role" style={{background:'var(--primary)'}}>DSED</span>
        {pend>0&&<span style={{background:'var(--bad)',color:'#fff',borderRadius:'10px',padding:'2px 8px',fontSize:'11px',fontWeight:700}}>{pend} pend.</span>}
        {modPostEnvio.length>0&&<span style={{background:'var(--bad)',color:'#fff',borderRadius:'10px',padding:'2px 8px',fontSize:'11px',fontWeight:700}} title={`Modificaciones post-envío: ${modPostEnvio.map(d=>d.abbr).join(', ')}`}>⚠ {modPostEnvio.map(d=>d.abbr).join(', ')} modificó</span>}
        <InstallBtn/><button className="btn-out" onClick={onLogout}>Salir</button>
      </div>
      <div className="main">
        <div className="tabs">
          {tabs.map(t=>(
            <button key={t.id} className={`tab${tab===t.id?' on':''}`} onClick={()=>setTab(t.id)}>
              {t.l}
              {t.id==='estado'&&pend>0&&<span className="tab-dot"/>}
              {t.id==='estado'&&pend===0&&Object.keys(subs).length>0&&modPostEnvio.length===0&&<span className="tab-dot ok"/>}
              {t.id==='estado'&&modPostEnvio.length>0&&<span className="tab-dot" style={{background:'var(--bad)',width:'9px',height:'9px'}}/>}
            </button>
          ))}
        </div>
        {tab==='semanas'   && <WeekMgr/>}
        {tab==='nomina'    && <AdminNomina week={week} subs={subs}/>}
        {tab==='estado'    && <StatusPanel week={week} subs={subs} phone={phone} setPhone={setPhone}/>}
        {tab==='editar'    && <AdminEditDisp week={week} subs={subs}/>}
        {tab==='unificado' && <UnifiedView week={week} subs={subs}/>}
        {tab==='exportar'  && <ExportPanel week={week} subs={subs}/>}
        {tab==='carpetas'  && <AdminCarpetas/>}
        {tab==='equidad'   && <EquidadPanel/>}
        {tab==='registro'  && <RegistroPanel/>}
        {tab==='respaldo'  && <RespaldoPanel/>}
      </div>
    </>
  );
};

const EventosExtra = ({week, eventosExtra, onChange, readOnly}) => {
  const [newEvt,setNewEvt] = useState({});
  if(!week) return null;
  const dias = week.dias||[];
  const hasDays = dias.some(d=>d.label);
  if(!hasDays) return null;

  const addEvt = (di,txt) => {
    if(!txt.trim()) return;
    const updated = {...eventosExtra};
    updated[String(di)] = [...(updated[String(di)]||[]), txt.trim().toUpperCase()];
    onChange(updated);
    setNewEvt(p=>({...p,[di]:''}));
  };
  const delEvt = (di,idx) => {
    const updated = {...eventosExtra};
    updated[String(di)] = (updated[String(di)]||[]).filter((_,i)=>i!==idx);
    onChange(updated);
  };

  return (
    <div className="evt-panel">
      <div className="evt-panel-t">Eventos de la semana</div>
      <div className="evt-days">
        {dias.map((d,i)=>!d.label?null:(
          <div key={i} className="evt-day-col">
            <div className="evt-day-hdr">{d.label}</div>
            {/* Admin fixture (readonly) */}
            {(d.eventos||[]).map((e,ei)=><div key={`f${ei}`} className="evt-item fixture">📌 {e}</div>)}
            {/* Division's own events */}
            {(eventosExtra[String(i)]||[]).map((e,ei)=>(
              <div key={`c${ei}`} className="evt-item custom">
                <span style={{flex:1}}>🔵 {e}</span>
                {!readOnly&&<button onClick={()=>delEvt(i,ei)} style={{background:'none',border:'none',color:'var(--dim)',cursor:'pointer',fontSize:'10px',padding:'0 2px'}}>✕</button>}
              </div>
            ))}
            {!readOnly&&(
              <div className="evt-add-row">
                <input
                  className="evt-add-inp"
                  type="text"
                  value={newEvt[i]||''}
                  onChange={e=>setNewEvt(p=>({...p,[i]:e.target.value}))}
                  onKeyDown={e=>e.key==='Enter'&&addEvt(i,newEvt[i]||'')}
                  placeholder="+ evento propio"
                />
                <button className="evt-add-btn" onClick={()=>addEvt(i,newEvt[i]||'')}>+</button>
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
};

const PersonnelEd = ({personal, onChange}) => {
  const [form,setForm] = useState({jerarquia:'Inspector',apellido:'',nombre:''});
  const [eid,setEid] = useState(null);
  const [showImport,setShowImport] = useState(false);

  const add = () => {
    if(!form.apellido.trim()){toast('bad','Error','Ingresá el apellido');return;}
    if(eid){ onChange(personal.map(p=>p.id===eid?{...p,...form}:p)); setEid(null); }
    else onChange([...personal,{id:uid(),...form}]);
    setForm(f=>({...f,apellido:'',nombre:''}));
  };
  const del = id => { if(confirm('¿Eliminar esta persona de la lista?')) onChange(personal.filter(p=>p.id!==id)); };
  const edit = p => { setForm({jerarquia:p.jerarquia,apellido:p.apellido,nombre:p.nombre}); setEid(p.id); };

  const handleImport = (parsed, mode) => {
    if(mode==='replace') onChange(parsed);
    else {
      // Merge: avoid duplicates by apellido+nombre
      const existing = new Set(personal.map(p=>`${p.apellido}|${p.nombre}`));
      const toAdd = parsed.filter(p=>!existing.has(`${p.apellido}|${p.nombre}`));
      onChange([...personal,...toAdd]);
      toast('ok',`Importados ${toAdd.length} efectivos`,`${parsed.length-toAdd.length} ya existían y fueron omitidos`);
    }
  };

  const sorted = sortP(personal);
  return (
    <div>
      {showImport&&<ImportModal onClose={()=>setShowImport(false)} onImport={handleImport}/>}
      <div className="sec-t">Efectivos de la División</div>

      <div className="card" style={{marginBottom:'18px'}}>
        <div className="card-t" style={{fontSize:'13px',marginBottom:'10px'}}>{eid?'✏ Editar efectivo':'+ Agregar efectivo'}</div>
        <div className="frow">
          <div className="fg"><label>Jerarquía</label><select value={form.jerarquia} onChange={e=>setForm(f=>({...f,jerarquia:e.target.value}))}>{JERARQUIAS.map(j=><option key={j}>{j}</option>)}</select></div>
          <div className="fg"><label>Apellido</label><input type="text" value={form.apellido} onChange={e=>setForm(f=>({...f,apellido:e.target.value.toUpperCase()}))} placeholder="APELLIDO" style={{width:'150px'}}/></div>
          <div className="fg"><label>Nombre</label><input type="text" value={form.nombre} onChange={e=>setForm(f=>({...f,nombre:e.target.value.toUpperCase()}))} placeholder="NOMBRE" style={{width:'150px'}}/></div>
          <div className="fg" style={{justifyContent:'flex-end'}}>
            <div style={{display:'flex',gap:'7px'}}>
              <button className="btn btn-p" onClick={add}>{eid?'✓ Actualizar':'+ Agregar'}</button>
              {eid&&<button className="btn btn-g" onClick={()=>{setEid(null);setForm({jerarquia:'Inspector',apellido:'',nombre:''});}}>Cancelar</button>}
            </div>
          </div>
        </div>
      </div>

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'10px',flexWrap:'wrap',gap:'8px'}}>
        <span style={{fontSize:'12px',color:'var(--muted)'}}>{personal.length} efectivos cargados</span>
        <button className="btn btn-a btn-sm" onClick={()=>setShowImport(true)}>📥 Importar desde Excel (.xlsx)</button>
      </div>

      {sorted.length===0
        ? <div className="alert-warn" style={{textAlign:'center'}}>Sin efectivos cargados. Agregá personas manualmente o importá desde Excel.</div>

// ── Calendario: fines de semana y feriados (Argentina) ──
const _norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const _DN=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const _MESN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const _pascua=y=>{const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mes=Math.floor((h+l-7*m+114)/31),dia=((h+l-7*m+114)%31)+1;return new Date(y,mes-1,dia);};
const _addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const _trasl=(y,m,d)=>{const dt=new Date(y,m-1,d),w=dt.getDay();if(w===2||w===3)return _addD(dt,-(w-1));if(w===4||w===5)return _addD(dt,8-w);return dt;};
const _fCache={};
// Feriados nacionales: fijos + trasladables + Carnaval/Viernes Santo. Puentes turísticos: solo los de 2026 (verificar los de otros años).
const feriadosAR=y=>{
  if(_fCache[y]) return _fCache[y];
  const M=new Map(); const put=(dt,n)=>M.set(`${dt.getMonth()+1}-${dt.getDate()}`,n);
  [[1,1,'Año Nuevo'],[3,24,'Día de la Memoria'],[4,2,'Día del Veterano de Malvinas'],[5,1,'Día del Trabajador'],[5,25,'Revolución de Mayo'],[6,20,'Día de la Bandera'],[7,9,'Día de la Independencia'],[12,8,'Inmaculada Concepción'],[12,25,'Navidad']]
    .forEach(([m,d,n])=>put(new Date(y,m-1,d),n));
  [[6,17,'Paso a la Inmortalidad de Güemes'],[8,17,'Paso a la Inmortalidad de San Martín'],[10,12,'Diversidad Cultural'],[11,20,'Soberanía Nacional']]
    .forEach(([m,d,n])=>put(_trasl(y,m,d),n));
  const p=_pascua(y); put(_addD(p,-48),'Carnaval'); put(_addD(p,-47),'Carnaval'); put(_addD(p,-2),'Viernes Santo');
  if(y===2026) [[3,23],[7,10],[12,7]].forEach(([m,d])=>put(new Date(y,m-1,d),'Feriado puente'));
  return _fCache[y]=M;
};
// Resuelve la fecha real de una etiqueta ("Jueves 24", "24/04", "Sábado 26 de abril") usando la fecha de creación de la semana como referencia
const diaInfo=(week,label,refOverride)=>{
  const none={weekend:false,feriado:null,date:null};
  const t=_norm(label); if(!t.trim()) return none;
  const dn=_DN.findIndex(n=>t.includes(n));
  const m=t.match(new RegExp('(\\d{1,2})(?:\\s*(?:/|-|de)\\s*(\\d{1,2}|'+_MESN.join('|')+'|setiembre))?(?:\\s*(?:/|-|de)\\s*(\\d{2,4}))?'));
  if(!m) return {...none,weekend:dn===0||dn===6};
  const d=parseInt(m[1],10);
  let mon=null; if(m[2]){ mon=/^\d+$/.test(m[2])?parseInt(m[2],10)-1:_MESN.indexOf(m[2]==='setiembre'?'septiembre':m[2]); if(mon<0||mon>11) mon=null; }
  const yx=m[3]?(m[3].length===2?2000+parseInt(m[3],10):parseInt(m[3],10)):null;
  const ref=refOverride||(week?.creadaEn?.toDate?week.creadaEn.toDate():new Date());
  const ry=ref.getFullYear(), rm=ref.getMonth();
  const find=strict=>{
    let best=null;
    const tr=(y,mo)=>{const dt=new Date(y,mo,d); if(dt.getMonth()!==mo) return; if(strict&&dn>=0&&dt.getDay()!==dn) return; const df=Math.abs(dt-ref); if(!best||df<best.df) best={dt,df};};
    if(yx!=null&&mon!=null) tr(yx,mon);
    else if(mon!=null) [ry-1,ry,ry+1].forEach(y=>tr(y,mon));
    else for(let k=-2;k<=3;k++){const b=new Date(ry,rm+k,1); tr(b.getFullYear(),b.getMonth());}
    return best&&best.dt;
  };
  const dt=find(true)||find(false);
  if(!dt) return {...none,weekend:dn===0||dn===6};
  return {date:dt,weekend:dt.getDay()===0||dt.getDay()===6,feriado:feriadosAR(dt.getFullYear()).get(`${dt.getMonth()+1}-${dt.getDate()}`)||null};
};
const tintTh=inf=>inf.feriado?{background:'#b91c1c'}:inf.weekend?{background:'#b45309'}:{};

//  CORRECTOR DE ESTADOS
// ══════════════════════════════════════════════════════════
const ESTADOS_CANON=['DISPONIBLE','VOLUNTARIO','GUARDIA - NO','PERMANENCIA','PERMANENCIA - NO','PERMANENCIA - DISPONIBLE','L/M - NO','L/A - NO','NO - SATURACIÓN','NO - DESARME','TURNO MÉDICO - NO','CURSO - NO','GUARDIA EDILICIA - NO','ESPECÍFICA','A/C','UCO','ARMERO','MOTO ANILLO','SERVICIO SATURACION - NO','DISPONIBLE SECTOR','SECUNDANTE'];
const _nk=s=>_norm(s).replace(/[^a-z0-9]/g,'');
const _lev=(a,b)=>{const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];};
const _hasNo=t=>/(^|[^A-Z])NO($|[^A-Z])/.test(_norm(t).toUpperCase());
// Devuelve {val,changed}. Solo corrige cuando está casi seguro; textos libres ("A/C RIVER") no se tocan.
const corregirEstado=v=>{
  const raw=String(v==null?'':v).trim().toUpperCase();
  if(!raw) return {val:v,changed:false};
  if(ESTADOS_CANON.includes(raw)) return {val:raw,changed:raw!==v};
  const k=_nk(raw); if(!k) return {val:v,changed:false};
  const ex=ESTADOS_CANON.filter(c=>_nk(c)===k);
  if(ex.length===1) return {val:ex[0],changed:true};
  if(k.length<5) return {val:v,changed:false};
  let best=null,bd=99,uniq=true;
  ESTADOS_CANON.forEach(c=>{
    const ck=_nk(c); if(ck.length<5) return;
    if(_hasNo(raw)!==_hasNo(c)) return; // nunca cambiar el sentido SÍ/NO
    const lim=ck.length>=12?2:1; const d=_lev(k,ck);
    if(d<=lim){ if(d<bd){bd=d;best=c;uniq=true;} else if(d===bd&&c!==best) uniq=false; }
  });
  return best&&uniq?{val:best,changed:true}:{val:v,changed:false};
};

const AUD={g:new Map(),t:null};
const _t=(s,n=70)=>String(s==null?'':s).slice(0,n);
const audPush=(ctx,item,ckey)=>{
  try{
    const gk=`${ctx.weekId||''}|${ctx.div||''}|${ctx.by||''}`;
    let g=AUD.g.get(gk);
    if(!g){g={ctx:{weekId:ctx.weekId||'',weekLabel:ctx.weekLabel||'',div:ctx.div||'',by:ctx.by||''},items:[],cells:new Map()};AUD.g.set(gk,g);}
    if(ckey){const e=g.cells.get(ckey); if(e){e.b=item.b;} else {g.cells.set(ckey,item);g.items.push(item);}}
    else g.items.push(item);
    clearTimeout(AUD.t); AUD.t=setTimeout(audFlush,6000);
  }catch{}
};
const audFlush=()=>{
  try{
    clearTimeout(AUD.t);
    const gs=[...AUD.g.values()]; AUD.g.clear();
    gs.forEach(g=>{
      const items=g.items.filter(i=>!(i.k==='c'||i.k==='ev'||i.k==='ed')||i.a!==i.b)
        .map(i=>({k:i.k,p:_t(i.p),d:_t(i.d),a:_t(i.a,120),b:_t(i.b,120),x:_t(i.x,160)}));
      for(let i=0;i<items.length;i+=150){
        db.collection('cambios').add({...g.ctx,ts:firebase.firestore.FieldValue.serverTimestamp(),n:items.length,items:items.slice(i,i+150)}).catch(()=>{});
      }
    });
  }catch{}
};
const audNow=(ctx,item)=>{audPush(ctx,item);audFlush();};
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') audFlush(); });
window.addEventListener('pagehide',audFlush);
const audDiff=(ctx,prev,next,week)=>{
  try{
    const pm=new Map((prev||[]).map(p=>[p.id,p])), nm=new Map((next||[]).map(p=>[p.id,p]));
    const nom=p=>`${p.jerarquia||''} ${p.apellido||''} ${p.nombre||''}`.trim();
    nm.forEach((p,id)=>{
      const o=pm.get(id);
      if(!o){audPush(ctx,{k:'alta',p:nom(p)},`alta|${id}`);return;}
      if(nom(o)!==nom(p)) audPush(ctx,{k:'ed',p:nom(p),a:nom(o),b:nom(p)},`ed|${id}`);
      (week?.dias||[]).forEach((d,di)=>{
        const a=(o.disponibilidad||{})[String(di)]||'', b=(p.disponibilidad||{})[String(di)]||'';
        if(a!==b) audPush(ctx,{k:'c',p:`${p.apellido||''} ${p.nombre||''}`.trim(),d:d.label||`Día ${di+1}`,a,b},`c|${id}|${di}`);
      });
    });
    pm.forEach((p,id)=>{ if(!nm.has(id)) audPush(ctx,{k:'baja',p:nom(p)},`baja|${id}`); });
  }catch{}
};
const audEvDiff=(ctx,prev,next,week)=>{
  try{
    const ks=new Set([...Object.keys(prev||{}),...Object.keys(next||{})]);
    ks.forEach(di=>{
      const a=((prev||{})[di]||[]).join(' / '), b=((next||{})[di]||[]).join(' / ');
      if(a!==b) audPush(ctx,{k:'ev',d:week?.dias?.[+di]?.label||`Día ${+di+1}`,a,b},`ev|${di}`);
    });
  }catch{}
};

const _ser=v=>{
  if(v&&typeof v.toMillis==='function') return {__ts:v.toMillis()};
  if(Array.isArray(v)) return v.map(_ser);
  if(v&&typeof v==='object'){const o={};Object.keys(v).forEach(k=>{o[k]=_ser(v[k]);});return o;}
  return v===undefined?null:v;
};
const _des=v=>{
  if(Array.isArray(v)) return v.map(_des);
  if(v&&typeof v==='object'){
    if(Object.keys(v).length===1&&typeof v.__ts==='number') return firebase.firestore.Timestamp.fromMillis(v.__ts);
    const o={};Object.keys(v).forEach(k=>{o[k]=_des(v[k]);});return o;
  }
  return v;
};
const snapSemana=async(wid)=>{

  ]);

  return {week:{id:wid,..._ser(ws.data()||{})},divs};
};
const snapNominas=async()=>{
  const ns=await Promise.all(DIVISIONS.map(d=>db.collection('nominas').doc(d.id).get()));
  const out={}; DIVISIONS.forEach((d,i)=>{ if(ns[i].exists) out[d.id]=_ser(ns[i].data()); }); return out;

const hacerRespaldo=async(motivo)=>{
  const aq=await db.collection('semanas').where('activa','==',true).limit(1).get();
  if(aq.empty) return null;
  const wid=aq.docs[0].id;
  const [sw,nominas]=await Promise.all([snapSemana(wid),snapNominas()]);
  const json=JSON.stringify({version:1,week:sw.week,divs:sw.divs,nominas});
  const id=new Date().toISOString().replace(/[:.]/g,'-');
  const nEf=Object.values(sw.divs).reduce((a,d)=>a+((d.personal||[]).length),0);
  await db.collection('respaldos').doc(id).set({ts:firebase.firestore.FieldValue.serverTimestamp(),motivo:motivo||'manual',weekId:wid,weekLabel:sw.week.label||'',efectivos:nEf,bytes:json.length});
  await db.collection('respaldos').doc(id).collection('data').doc('p').set({json});
  await db.collection('config').doc('backup').set({lastAt:Date.now()},{merge:true});
  // Conservar solo los 30 más recientes
  try{
    const all=await db.collection('respaldos').orderBy('ts','desc').limit(60).get();
    for(const d of all.docs.slice(30)){
      await d.ref.collection('data').doc('p').delete().catch(()=>{});
      await d.ref.delete().catch(()=>{});
    }
  }catch{}
  return id;
};

const restaurarRespaldo=async(id)=>{
  const s=await db.collection('respaldos').doc(id).collection('data').doc('p').get();
  if(!s.exists) throw new Error('El respaldo no tiene datos');
  const P=JSON.parse(s.data().json);
  await hacerRespaldo('antes de restaurar').catch(()=>{});
  const w=_des(P.week); const wid=w.id; delete w.id;
  const act=await db.collection('semanas').where('activa','==',true).get();
  for(const d of act.docs) if(d.id!==wid) await d.ref.update({activa:false});
  await db.collection('semanas').doc(wid).set({...w,activa:true});
  for(const [did,dv] of Object.entries(P.divs||{})) await db.collection('semanas').doc(wid).collection('divisiones').doc(did).set(_des(dv));
  for(const [did,nv] of Object.entries(P.nominas||{})) await db.collection('nominas').doc(did).set(_des(nv));
  return P.week.label;
};

const AvailGrid = ({week, personal, onChange, readOnly, div, resaltarVacios}) => {

  const undoSt=useRef([]); const redoSt=useRef([]); const lastEdit=useRef({key:null,t:0});

  const [mobDay,setMobDay]=useState(0);

  useEffect(()=>{
    const up=()=>{ const f=fillRef.current; if(!f) return; fillRef.current=null; setFill(null); if(applyFillRef.current) applyFillRef.current(f); };
    window.addEventListener('mouseup',up); return()=>window.removeEventListener('mouseup',up);
  },[]);
  const dias=week?.dias||[];
  // El historial de deshacer es propio de cada semana/división
  useEffect(()=>{undoSt.current=[];redoSt.current=[];lastEdit.current={key:null,t:0};setTick(t=>t+1);},[week?.id,div?.id]);

  if(!week) return <div className="alert-warn">No hay semana activa. El administrador debe configurar la semana primero.</div>;

  const infos=dias.map(d=>diaInfo(week,d.label));

  const curDay=dIdx.includes(mobDay)?mobDay:dIdx[0];

  // ── historial (deshacer / rehacer) ──
  const commit=(np,key)=>{
    const now=Date.now();
    const merge=key&&lastEdit.current.key===key&&now-lastEdit.current.t<1500; // tipeo seguido en la misma celda = 1 solo paso
    if(!merge){undoSt.current.push(personal); if(undoSt.current.length>60) undoSt.current.shift();}
    lastEdit.current={key:key||null,t:now}; redoSt.current=[]; setTick(t=>t+1); onChange(np);
  };
  const undo=()=>{ if(!undoSt.current.length) return; const prev=undoSt.current.pop(); redoSt.current.push(personal); lastEdit.current={key:null,t:0}; setTick(t=>t+1); onChange(prev); };
  const redo=()=>{ if(!redoSt.current.length) return; const nx=redoSt.current.pop(); undoSt.current.push(personal); lastEdit.current={key:null,t:0}; setTick(t=>t+1); onChange(nx); };

  };

  // ── edición ──
  const upd=(pid,di,val)=>commit(personal.map(p=>p.id!==pid?p:{...p,disponibilidad:{...(p.disponibilidad||{}),[String(di)]:val.toUpperCase()}}),`${pid}-${di}`);
  const fillAll=(di,val)=>commit(personal.map(p=>({...p,disponibilidad:{...(p.disponibilidad||{}),[String(di)]:val}})));
  const fillPerson=(pid,val)=>commit(personal.map(p=>{
    if(p.id!==pid) return p;
    const d={...(p.disponibilidad||{})}; dias.forEach((_,i)=>{ if(!d[String(i)]) d[String(i)]=val; }); return {...p,disponibilidad:d};
  }));

  // ── arrastrar para rellenar ──
  const fillRange=f=>({p0:Math.min(f.pi,f.ei),p1:Math.max(f.pi,f.ei),d0:Math.min(f.di,f.ej),d1:Math.max(f.di,f.ej)});
  const inFill=(pi,di)=>{ if(!fill) return false; const r=fillRange(fill); return pi>=r.p0&&pi<=r.p1&&di>=r.d0&&di<=r.d1; };
  const fillStart=(e,pi,di,val)=>{ e.preventDefault(); e.stopPropagation(); const f={pi,di,val,ei:pi,ej:di}; fillRef.current=f; setFill(f); };
  const fillEnter=(pi,di)=>{
    const f=fillRef.current; if(!f) return;
    const vert=Math.abs(pi-f.pi)>=Math.abs(di-f.di);
    const nf={...f,ei:vert?pi:f.pi,ej:vert?f.di:di}; fillRef.current=nf; setFill(nf);
  };
  applyFillRef.current=f=>{
    const r=fillRange(f); const ids=new Set(visible.slice(r.p0,r.p1+1).map(p=>p.id)); let n=0;
    const np=personal.map(p=>{
      if(!ids.has(p.id)) return p;
      const d={...(p.disponibilidad||{})};
      for(let c=r.d0;c<=r.d1;c++){ if(!dias[c]) continue; if(String(d[String(c)]||'')!==f.val){ d[String(c)]=f.val; n++; } }
      return {...p,disponibilidad:d};
    });
    if(n>0){ commit(np); toast('ok',`${n} celda${n>1?'s rellenadas':' rellenada'}`,'Ctrl+Z para deshacer'); }
  };
  // ── corrector de estados ──
  const fixCell=(pid,di,raw)=>{
    const r=corregirEstado(raw); if(!r.changed) return;
    commit(personal.map(p=>p.id!==pid?p:{...p,disponibilidad:{...(p.disponibilidad||{}),[String(di)]:r.val}}));
    toast('info','Estado corregido',`${String(raw).toUpperCase()} → ${r.val}`);
  };

  // Pegado desde Excel/Sheets: columnas con Tab, filas con Enter
  const handlePaste=(e,personIdx,dayIdx)=>{
    const text=e.clipboardData.getData('text'); if(!text) return;
    if(!(text.includes('\t')||text.includes('\n'))) return;
    e.preventDefault(); let nfix=0;
    const rows=text.trimEnd().split(/\r?\n/).map(r=>r.split('\t'));
    const changes={};
    rows.forEach((cols,ri)=>{
      const tp=visible[personIdx+ri]; if(!tp) return;
      changes[tp.id]=changes[tp.id]||{};
      cols.forEach((val,ci)=>{ const td=dayIdx+ci; if(td>=dias.length) return; const cr=corregirEstado(val.trim().toUpperCase()); if(cr.changed) nfix++; changes[tp.id][String(td)]=cr.val; });
    });
    commit(personal.map(p=>changes[p.id]?{...p,disponibilidad:{...(p.disponibilidad||{}),...changes[p.id]}}:p));
    const fk={}; Object.entries(changes).forEach(([pid,ds])=>Object.keys(ds).forEach(di=>{fk[`${pid}-${di}`]=true;}));
    setFlashing(fk); setTimeout(()=>setFlashing({}),600);
    const n=Object.values(changes).reduce((s,d)=>s+Object.keys(d).length,0);
    toast('ok',`${n} celd${n>1?'as pegadas':'a pegada'}`,nfix?`${nfix} estado${nfix>1?'s corregidos':' corregido'} automáticamente`:'');
  };

  // ── contador por día ──
  const stats=di=>{ const c={disp:0,vol:0,no:0,otro:0,vacio:0}; personal.forEach(p=>{c[clasifAv((p.disponibilidad||{})[String(di)])]++;}); return c; };
  const cellBg=(v,inf,di)=>{ const k=clasifAv(v); if(AV_BG[k]) return AV_BG[k]; if(resaltarVacios&&!readOnly&&k==='vacio'&&dias[di]?.label) return '#fdba74'; return inf.feriado?'#fef2f2':inf.weekend?'#fffbeb':undefined; };
  const dayPos=dIdx.indexOf(curDay);

  const Counters=(
    <div style={{display:'flex',gap:'8px',overflowX:'auto',paddingBottom:'6px',marginBottom:'10px'}}>
      {dIdx.map(di=>{
        const d=dias[di], c=stats(di), inf=infos[di];
        const act=viewMode==='day'&&di===curDay;
        return (
          <div key={di} onClick={()=>{setMobDay(di);}}
            style={{minWidth:'150px',flexShrink:0,background:'#fff',border:`1.5px solid ${act?'var(--primary)':'var(--border)'}`,borderTop:`3px solid ${inf.feriado?'#b91c1c':inf.weekend?'#b45309':'var(--primary)'}`,borderRadius:'8px',padding:'7px 10px',boxShadow:'var(--shadow)',cursor:viewMode==='day'?'pointer':'default'}}>
            <div style={{fontFamily:'Oswald,sans-serif',fontSize:'12px',fontWeight:700,color:'var(--text)',letterSpacing:'.3px'}}>{d.label}</div>
            {(inf.feriado||inf.weekend)&&<div style={{fontSize:'9px',fontWeight:600,color:inf.feriado?'#b91c1c':'#b45309',marginBottom:'2px'}}>{inf.feriado?`🎌 ${inf.feriado}`:'FIN DE SEMANA'}</div>}
            <div style={{display:'flex',gap:'8px',fontSize:'11px',fontFamily:'IBM Plex Mono,monospace',marginTop:'3px',flexWrap:'wrap'}}>
              <span style={{color:'#059669',fontWeight:700}} title="Disponibles">✓{c.disp}</span>
              {c.vol>0&&<span style={{color:'#0f766e',fontWeight:700}} title="Voluntarios">V{c.vol}</span>}
              <span style={{color:'#dc2626',fontWeight:700}} title="No disponibles">✕{c.no}</span>
              <span style={{color:'#1d4ed8',fontWeight:700}} title="Afectados / otros">◆{c.otro}</span>
              <span style={{color:c.vacio>0?'#d97706':'var(--dim)',fontWeight:700}} title="Sin cargar">○{c.vacio}</span>
            </div>
          </div>
        );
      })}
    </div>
  );

  const canUndo=undoSt.current.length>0, canRedo=redoSt.current.length>0;

  return (
    <div onKeyDown={onKey} className={fill?'filling':''}>
      <div className="sec-t">{week.label}</div>

      <div style={{marginBottom:'10px',display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap'}}>
        <div style={{position:'relative',flex:'0 0 auto'}}>
          <span style={{position:'absolute',left:'8px',top:'50%',transform:'translateY(-50%)',color:'var(--muted)',fontSize:'13px',pointerEvents:'none'}}>&#128269;</span>
          <input type="text" data-native-undo="1" value={buscar} onChange={e=>setBuscar(e.target.value)} placeholder="Buscar apellido o nombre..."
            style={{width:'230px',background:'#fff',border:'1.5px solid var(--border)',borderRadius:'6px',padding:'6px 8px 6px 28px',fontSize:'13px',color:'var(--text)',outline:'none'}}/>
        </div>
        {buscar&&<span style={{fontSize:'12px',color:'var(--muted)'}}>{visible.length} de {sorted.length}</span>}
        {buscar&&<button className="btn btn-g btn-sm" onClick={()=>setBuscar('')}>✕ Limpiar</button>}
        <div style={{flex:1}}/>
        {!readOnly&&<>
          <button className="btn btn-g btn-sm" onClick={undo} disabled={!canUndo} title="Deshacer (Ctrl+Z)">↶ Deshacer</button>
          <button className="btn btn-g btn-sm" onClick={redo} disabled={!canRedo} title="Rehacer (Ctrl+Y)">↷ Rehacer</button>
        </>}
        <button className="btn btn-g btn-sm" onClick={()=>setViewMode(v=>v==='grid'?'day':'grid')}>
          {viewMode==='grid'?'📱 Vista por día':'🖥 Vista planilla'}
        </button>
      </div>

      {Counters}

      {/* leyenda */}
      <div style={{display:'flex',gap:'10px',flexWrap:'wrap',fontSize:'10.5px',color:'var(--muted)',marginBottom:'10px'}}>
        {[['#d1fae5','Disponible'],['#ccfbf1','Voluntario'],['#fecaca','No disponible'],['#dbeafe','Afectado / otro'],['#fffbeb','Fin de semana (vacío)'],['#fef2f2','Feriado (vacío)']].map(([c,l])=>(
          <span key={l} style={{display:'inline-flex',alignItems:'center',gap:'4px'}}><span style={{width:'11px',height:'11px',background:c,border:'1px solid var(--border)',borderRadius:'3px',display:'inline-block'}}/>{l}</span>
        ))}
      </div>

      {viewMode==='grid'?(
        <>
          {!readOnly&&(
            <div style={{marginBottom:'9px',display:'flex',gap:'7px',flexWrap:'wrap',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{display:'flex',gap:'7px',flexWrap:'wrap',alignItems:'center'}}>
                <span style={{fontSize:'12px',color:'var(--muted)'}}>Relleno rápido:</span>
                {dias.map((d,i)=>d.label&&(<button key={i} className="btn btn-g btn-sm" onClick={()=>fillAll(i,'DISPONIBLE')} style={{fontSize:'11px'}}>✓ {d.label}</button>))}
              </div>
              <span style={{fontSize:'10px',color:'var(--dim)',fontStyle:'italic'}}>💡 Pegá desde Excel con Ctrl+V · Arrastrá el cuadradito de la celda para copiar · Ctrl+Z deshace</span>
            </div>
          )}
          <div className="grid-wrap">
            <table className="avt">
              <thead>
                <tr>
                  <th className="sticky-col sticky-col-1" style={{minWidth:'115px'}}>JERARQUÍA</th>
                  <th className="sticky-col sticky-col-2" style={{minWidth:'115px'}}>APELLIDO</th>
                  <th className="sticky-col sticky-col-3" style={{minWidth:'95px'}}>NOMBRE</th>
                  {dias.map((d,i)=>(
                    <th key={i} className="dc" style={tintTh(infos[i])}>
                      {d.label||`DÍA ${i+1}`}
                      {d.serial&&<div style={{fontSize:'9px',fontFamily:'IBM Plex Mono',fontWeight:'normal',color:'rgba(255,255,255,.7)'}}>{d.serial}</div>}
                      <DiaBadge inf={infos[i]}/>
                    </th>
                  ))}
                  {!readOnly&&<th style={{width:'60px'}}>QS</th>}
                </tr>
              </thead>
              <tbody>
                {visible.map((p,pi)=>(
                  <tr key={p.id}>
                    <td className="sticky-col sticky-col-1" style={{fontSize:'11px',color:'var(--muted)',whiteSpace:'nowrap'}}>{p.jerarquia}</td>
                    <td className="sticky-col sticky-col-2" style={{fontWeight:600,whiteSpace:'nowrap'}}>{p.apellido}</td>
                    <td className="sticky-col sticky-col-3" style={{whiteSpace:'nowrap'}}>{p.nombre}</td>
                    {dias.map((_,di)=>{
                      const v=(p.disponibilidad||{})[String(di)]||'';
                      const fl=flashing[`${p.id}-${di}`];
                      return (
                        <td key={di} className="fc" onMouseEnter={()=>fillEnter(pi,di)} style={{padding:readOnly?'4px 5px':'2px',transition:'background .3s',background:fl?'rgba(5,150,105,.35)':cellBg(v,infos[di],di),outline:inFill(pi,di)?'2px dashed var(--primary)':undefined,outlineOffset:'-2px'}}>
                          {readOnly
                            ?<span style={{display:'block',textAlign:'center',fontFamily:'IBM Plex Mono',fontSize:'11px',color:avColor(v)}}>{v}</span>
                            :<input className="avail-inp" type="text" list="avopt" value={v} style={{color:avColor(v)}}
                                onChange={e=>upd(p.id,di,e.target.value)} onBlur={e=>fixCell(p.id,di,e.target.value)} onPaste={e=>handlePaste(e,pi,di)} placeholder="—"/>}
                          {!readOnly&&<span className="fill-h" title="Arrastrá para copiar este valor" onMouseDown={e=>fillStart(e,pi,di,v)}/>}
                        </td>
                      );
                    })}
                    {!readOnly&&<td><button className="btn btn-g btn-sm" style={{fontSize:'10px',width:'100%'}} onClick={()=>fillPerson(p.id,'DISPONIBLE')} title="DISPONIBLE en vacíos">✓</button></td>}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </>
      ):(
        /* ── VISTA POR DÍA (pensada para celular) ── */
        <div>
          <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px'}}>
            <button className="btn btn-g" disabled={dayPos<=0} onClick={()=>setMobDay(dIdx[dayPos-1])} style={{padding:'10px 14px',fontSize:'16px'}}>◀</button>
            <div style={{flex:1,textAlign:'center',background:'#fff',border:'1px solid var(--border)',borderTop:`3px solid ${infos[curDay]?.feriado?'#b91c1c':infos[curDay]?.weekend?'#b45309':'var(--primary)'}`,borderRadius:'8px',padding:'8px'}}>
              <div style={{fontFamily:'Oswald,sans-serif',fontSize:'17px',fontWeight:700,color:'var(--primary)'}}>{dias[curDay]?.label}</div>
              {infos[curDay]?.feriado&&<div style={{fontSize:'11px',fontWeight:600,color:'#b91c1c'}}>🎌 Feriado · {infos[curDay].feriado}</div>}
              {!infos[curDay]?.feriado&&infos[curDay]?.weekend&&<div style={{fontSize:'11px',fontWeight:600,color:'#b45309'}}>Fin de semana</div>}
              <div style={{fontSize:'10px',color:'var(--dim)'}}>Día {dayPos+1} de {dIdx.length}</div>
            </div>
            <button className="btn btn-g" disabled={dayPos>=dIdx.length-1} onClick={()=>setMobDay(dIdx[dayPos+1])} style={{padding:'10px 14px',fontSize:'16px'}}>▶</button>
          </div>
          {(dias[curDay]?.eventos||[]).length>0&&(
            <div style={{fontSize:'11px',color:'var(--muted)',fontFamily:'IBM Plex Mono',marginBottom:'8px'}}>📌 {(dias[curDay].eventos||[]).join(' · ')}</div>
          )}
          {!readOnly&&<div style={{marginBottom:'10px'}}><button className="btn btn-g btn-sm" onClick={()=>fillAll(curDay,'DISPONIBLE')}>✓ Todos DISPONIBLE este día</button></div>}
          <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
            {visible.map((p,pi)=>{
              const v=(p.disponibilidad||{})[String(curDay)]||'';
              const fl=flashing[`${p.id}-${curDay}`];
              return (
                <div key={p.id} style={{display:'flex',alignItems:'center',gap:'8px',background:fl?'rgba(5,150,105,.35)':(cellBg(v,infos[curDay],curDay)||'#fff'),border:'1px solid var(--border)',borderRadius:'8px',padding:'6px 8px'}}>
                  <div style={{flex:'1 1 45%',minWidth:0}}>
                    <div style={{fontSize:'10px',color:'var(--muted)'}}>{p.jerarquia}</div>
                    <div style={{fontWeight:600,fontSize:'13px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{p.apellido} <span style={{fontWeight:400}}>{p.nombre}</span></div>
                  </div>
                  {readOnly
                    ?<span style={{flex:'1 1 55%',textAlign:'center',fontFamily:'IBM Plex Mono',fontSize:'12px',color:avColor(v)}}>{v}</span>
                    :<input type="text" list="avopt" value={v} placeholder="—" onChange={e=>upd(p.id,curDay,e.target.value)} onBlur={e=>fixCell(p.id,curDay,e.target.value)} onPaste={e=>handlePaste(e,pi,curDay)}
                        style={{flex:'1 1 55%',minWidth:0,fontSize:'16px',fontFamily:'IBM Plex Mono,monospace',textTransform:'uppercase',textAlign:'center',padding:'9px 6px',color:avColor(v),background:'rgba(255,255,255,.85)'}}/>}
                </div>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
};

// ================================================================
//  HISTORIAL (Division) - semanas anteriores solo lectura
// ================================================================
const HistorialDiv = ({div}) => {
  const [weeks,setWeeks]   = useState([]);
  const [selWeek,setSelWeek] = useState(null);
  const [selData,setSelData] = useState(null);
  const [loading,setLoading] = useState(false);

  useEffect(()=>
    db.collection('semanas').orderBy('creadaEn','desc').onSnapshot(s=>{
      setWeeks(s.docs.map(d=>({id:d.id,...d.data()})).filter(w=>!w.activa));
    })
  ,[]);

  const [exporting, setExporting] = useState(false);

  const loadWeek = async (w) => {
    setLoading(true); setSelWeek(w); setSelData(null);
    try{
      const snap=await db.collection('semanas').doc(w.id).collection('divisiones').doc(div.id).get();
      setSelData(snap.exists?snap.data():{personal:[],eventosExtra:{},estado:'pendiente'});
    }catch(e){ toast('bad','Error','No se pudo cargar la semana'); }
    setLoading(false);
  };

  const exportarExcel = async () => {
    if(!selWeek||!selData) return;
    setExporting(true);
    try{
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Disponibles');
      const dias = selWeek.dias||[];
      const personal = sortP(selData.personal||[]);
      const evExtra = selData.eventosExtra||{};
      // Anchos de columna
      ws.getColumn(1).width=18; ws.getColumn(2).width=18; ws.getColumn(3).width=16;
      dias.forEach((_,i)=>{ ws.getColumn(4+i).width=26; });
      const BLU={type:'pattern',pattern:'solid',fgColor:{argb:'FF1E3A8A'}};
      const EXT={type:'pattern',pattern:'solid',fgColor:{argb:'FF0F1E3A'}};
      // Fixture de eventos de la semana
      const maxFixture=Math.max(0,...dias.map(d=>(d.eventos||[]).length));
      for(let ei=0;ei<maxFixture;ei++){
        const row=ws.addRow([ei===0?'FIXTURE':'',' ',' ', ...dias.map(d=>(d.eventos||[])[ei]||'')]);
        row.eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF0F172A'}}; c.font={color:{argb:'FF8B949E'},size:9,name:'Calibri'}; c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; });
        row.height=16;
      }
      // Cabecera de dias
      const hr=ws.addRow(['JERARQUÍA','APELLIDO','NOMBRE',...dias.map(d=>d.label+(d.serial?'\n'+d.serial:''))]);
      hr.eachCell(c=>{ c.fill=BLU; c.font={bold:true,color:{argb:'FFFFFFFF'},size:10,name:'Calibri'}; c.alignment={horizontal:'center',vertical:'middle',wrapText:true}; c.border={bottom:{style:'thin',color:{argb:'FF0F172A'}}}; });
      hr.height=22; xlMarcarDias(hr,dias,selWeek); xlHoja(ws,hr.number);
      // Cabecera de division
      const dr=ws.addRow([div.abbr,div.name,'',...dias.map(()=>'')]);
      ws.mergeCells(dr.number,1,dr.number,3);
      dr.eachCell(c=>{ c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF21262D'}}; c.font={bold:true,color:{argb:'FFFBBF24'},size:11,name:'Calibri'}; });
      dr.height=18;
      // Eventos extra de la division
      const maxEx=Math.max(0,...dias.map((_,i)=>(evExtra[String(i)]||[]).length));
      for(let ei=0;ei<maxEx;ei++){
        const er=ws.addRow([ei===0?`+ Eventos ${div.abbr}`:'','','',...dias.map((_,di)=>(evExtra[String(di)]||[])[ei]||'')]);
        er.eachCell(c=>{ c.fill=EXT; c.font={color:{argb:'FF60A5FA'},size:9,name:'Calibri'}; c.alignment={horizontal:'center',vertical:'middle'}; });
        er.height=14;
      }
      // Filas de personal
      personal.forEach((per,pi)=>{
        const row=ws.addRow([per.jerarquia,per.apellido.toUpperCase(),per.nombre.toUpperCase(),...dias.map((_,di)=>(per.disponibilidad||{})[String(di)]||'')]);
        const alt=pi%2!==0;
        row.eachCell((c,col)=>{
          if(col<4){
            c.fill={type:'pattern',pattern:'solid',fgColor:{argb:alt?'FFF8FAFC':'FFFFFFFF'}};
            c.font={size:10,name:'Calibri',color:{argb:'FF1E293B'}};
            c.alignment={horizontal:'left',vertical:'middle'};
            c.border={bottom:{style:'hair',color:{argb:'FFE2E8F0'}}};
          } else { estiloAsignacion(c, alt); }
        });
        row.height=17;
      });
      xlTotales(ws,personal,dias);
      const buf=await wb.xlsx.writeBuffer();
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
      a.download=`HIST_${div.abbr}_${selWeek.label.replace(/\s+/g,'_')}.xlsx`;
      a.click();
      toast('ok','Excel exportado',`${div.abbr} — ${selWeek.label}`);
    }catch(e){ toast('bad','Error al exportar',e.message); }
    setExporting(false);
  };

  return (
    <div>
      <div className="sec-t">Historial de Semanas</div>
      {weeks.length===0&&<div className="alert-warn">No hay semanas anteriores registradas.</div>}
      {weeks.length>0&&(
        <div style={{display:'flex',gap:'7px',flexWrap:'wrap',marginBottom:'20px'}}>
          {weeks.map(w=>(
            <button key={w.id} className={`btn ${selWeek?.id===w.id?'btn-p':'btn-g'}`} onClick={()=>loadWeek(w)}>{w.label}</button>
          ))}
        </div>
      )}
      {loading&&<div style={{color:'var(--muted)',padding:'20px',textAlign:'center'}}>Cargando semana...</div>}
      {selData&&selWeek&&!loading&&(
        <div>
          <div className="card" style={{marginBottom:'16px'}}>
            <div className="card-t">{selWeek.label}</div>
            <div style={{display:'flex',gap:'10px',alignItems:'center',flexWrap:'wrap',justifyContent:'space-between'}}>
              <div style={{display:'flex',gap:'9px',alignItems:'center',flexWrap:'wrap'}}>
                <span className={`sb ${selData.estado==='enviado'?'sb-ok':'sb-p'}`}>{selData.estado==='enviado'?'Enviado':'Pendiente'}</span>
                <span style={{fontSize:'12px',color:'var(--muted)'}}>{(selData.personal||[]).length} efectivos</span>
                {selData.enviadaEn&&<span style={{fontSize:'12px',color:'var(--muted)',fontFamily:'IBM Plex Mono'}}>Enviado: {fmtDT(selData.enviadaEn)}</span>}
              </div>
              {(selData.personal||[]).length>0&&(
                <button className="btn btn-ok btn-sm" onClick={exportarExcel} disabled={exporting}>
                  {exporting?'⏳ Exportando...':'⬇ Descargar Excel'}
                </button>
              )}
            </div>
          </div>
          {(selData.personal||[]).length>0
            ? <AvailGrid week={selWeek} personal={selData.personal} onChange={()=>{}} readOnly={true} div={div}/>
            : <div className="alert-warn">Sin personal cargado en esta semana.</div>
          }
        </div>
      )}
    </div>
  );
};
